<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тень</title>
<style>
:root{--blue:#4a76a8;--blue2:#3b5f8a;--bg:#edeef0;--w:#fff;--bd:#d8dbdf;--lk:#2b587a;--gold:#f5a623;--red:#d9534f;--green:#5cb85c;--hh:44px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,Verdana,sans-serif;background:var(--bg);color:#2a2a2a;font-size:13px;line-height:1.4;padding-top:var(--hh);min-height:100vh}
.hd{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--blue);z-index:1000;box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;align-items:center;padding:0 8px;gap:6px}
.lg{color:#fff;font-weight:bold;font-size:15px;white-space:nowrap;text-decoration:none}
.nv{display:flex;gap:2px;flex:1;overflow-x:auto}
.nv a{color:#dce4f0;text-decoration:none;padding:6px 8px;border-radius:3px;font-size:11px;white-space:nowrap}
.nv a.ac{background:rgba(255,255,255,.2);color:#fff;font-weight:bold}
.us{display:flex;align-items:center;gap:5px;color:#fff;font-size:11px;cursor:pointer;padding:3px 5px;border-radius:3px;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:11px;border:2px solid transparent;background-color:#999}
.av.vp{border-color:var(--gold);box-shadow:0 0 5px var(--gold)}
.ly{max-width:960px;margin:0 auto;padding:8px;display:flex;gap:8px}
.sd{width:170px;flex-shrink:0}
.mn{flex:1;min-width:0}
.bk{background:var(--w);border:1px solid var(--bd);border-radius:4px;margin-bottom:8px;overflow:hidden}
.bh{padding:9px 12px;border-bottom:1px solid var(--bd);font-weight:bold;font-size:13px;background:#fafbfc;display:flex;align-items:center;gap:6px}
.bb{padding:10px 12px;max-height:60vh;overflow-y:auto}
.mna a{display:block;padding:9px 12px;color:var(--lk);text-decoration:none;border-bottom:1px solid #f0f1f3;font-size:12px}
.mna a.ac{background:#e8edf3;font-weight:bold;color:#333}
.mna a:last-child{border-bottom:none}
.ms{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f2f3f5}
.ms:last-child{border-bottom:none}
.mva{width:38px;height:38px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:13px;border:2px solid transparent;background-color:#999}
.mva.vp{border-color:var(--gold);box-shadow:0 0 5px var(--gold)}
.mbd{flex:1;min-width:0}
.mmt{font-size:11px;color:#999;margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.au{font-weight:bold;color:var(--lk);cursor:pointer}
.au.an{color:#888;font-style:italic;cursor:default}
.tx{word-break:break-word;font-size:12px}
.bt{padding:7px 14px;background:var(--blue2);color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:12px;font-weight:bold;font-family:inherit}
.bt:active{transform:scale(.97)}
.bt2{background:#5b88bd}.btg{background:#999}.btr{background:var(--red)}.btgr{background:var(--green)}
.bd{background:var(--gold);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.bdr{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:3px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;background:#fafbfc}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff}
textarea{resize:vertical;min-height:45px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:15px}
.mo.on{display:flex}
.mb{background:#fff;border-radius:6px;padding:20px;width:100%;max-width:340px;max-height:90vh;overflow-y:auto;text-align:center}
.mb h3{margin-bottom:12px;font-size:15px}
.mb input,.mb textarea{margin-bottom:8px;text-align:left}
.mb .bt{width:100%;margin-bottom:6px}
.ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.ts.on{opacity:1}
.em{text-align:center;padding:30px 15px;color:#999;font-size:12px}
.ct{padding:9px 10px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.ct.ac{background:#e8edf3}
.ct .rn{background:none;border:none;cursor:pointer;color:#999;font-size:14px;padding:0 4px}
.ch{display:flex;height:55vh;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.chl{width:150px;border-right:1px solid #eee;overflow-y:auto;background:#fafbfc;flex-shrink:0}
.chm{flex:1;display:flex;flex-direction:column;min-width:0}
.chms{flex:1;overflow-y:auto;padding:8px}
.chi{padding:8px;border-top:1px solid #eee;display:flex;gap:6px}
.chi input{flex:1}
.bl{display:inline-block;padding:5px 10px;border-radius:10px;background:#e8edf3;max-width:80%;word-break:break-word;font-size:12px}
.mn2{text-align:right}
.mn2 .bl{background:#c9daf8}
.mtm{font-size:9px;color:#999;margin-top:2px}
.banner{width:100%;height:120px;background-size:cover;background-position:center;background-color:#4a76a8;position:relative}
.banner-empty{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;opacity:.6}
.prof-ava{width:80px;height:80px;border-radius:50%;margin:-40px auto 10px;background-size:cover;background-position:center;border:4px solid #fff;position:relative;z-index:2;background-color:#999;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:28px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.prof-ava.vp{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.file-inp{display:none}
.adm-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.adm-stat{flex:1;min-width:100px;padding:10px;background:#fafbfc;border:1px solid var(--bd);border-radius:4px;text-align:center}
.adm-stat b{font-size:20px;display:block;color:var(--blue2)}
.adm-stat small{font-size:10px;color:#666}
.ucard{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.ucard b{font-size:12px}
.ucard .actions{display:flex;gap:4px}
.ucard .actions button{padding:3px 8px;font-size:10px}
.promo{padding:8px 10px;border-bottom:1px solid #eee;font-size:11px}
.promo b{font-size:12px}
.promo small{color:#666;display:block}
@media(max-width:800px){.sd{display:none}.ly{padding:6px}.nv a{font-size:10px;padding:5px 6px}.us span{display:none}}
@media(max-width:800px) and (orientation:landscape){.sd{display:block;width:130px}.mna a{padding:7px 9px;font-size:11px}}
@media(max-width:400px){.lg{font-size:13px}.nv a{padding:5px 4px;font-size:9px}}
</style>
</head>
<body>

<div class="hd">
<a href="#" class="lg" onclick="nav('profile');return false">📚 Тень</a>
<div class="nv" id="navTop"></div>
<div class="us" id="userMini" onclick="onUserClick()">
<div class="av" id="miniAva">?</div>
<span id="miniName">Войти</span>
</div>
</div>

<div class="ly">
<div class="sd"><div class="bk mna" id="sideMenu"></div></div>
<div class="mn" id="app"></div>
</div>

<div class="mo" id="authModal"><div class="mb">
<h3>Вход / Регистрация</h3>
<input type="email" id="authEmail" placeholder="Email">
<input type="password" id="authPass" placeholder="Пароль">
<button class="bt" onclick="doRegister()">Зарегистрироваться</button>
<button class="bt bt2" onclick="doLogin()">Войти</button>
<button class="bt btg" onclick="doLogout()">Выйти</button>
<button class="bt btg" onclick="closeModal('authModal')">Закрыть</button>
</div></div>

<div class="mo" id="profModal"><div class="mb">
<h3>Редактировать профиль</h3>
<input id="profNick" placeholder="Никнейм" maxlength="20">
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:4px 0">Описание</label>
<textarea id="profDesc" placeholder="О себе" maxlength="200" style="min-height:60px"></textarea>
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:4px 0">Аватар (макс 300×300)</label>
<input type="file" id="profAvaFile" accept="image/*" class="file-inp">
<button class="bt bt2" onclick="document.getElementById('profAvaFile').click()">📷 Загрузить аватар</button>
<img id="profAvaPreview" style="max-width:80px;max-height:80px;margin:6px auto;display:none;border-radius:50%">
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:4px 0">Баннер профиля (VIP)</label>
<input type="file" id="profBannerFile" accept="image/*" class="file-inp">
<button class="bt bt2" onclick="document.getElementById('profBannerFile').click()">🖼 Загрузить баннер</button>
<img id="profBannerPreview" style="max-width:100%;max-height:80px;margin:6px 0;display:none">
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:4px 0">Фон профиля (VIP, ссылка или файл)</label>
<input type="file" id="profBgFile" accept="image/*" class="file-inp">
<button class="bt bt2" onclick="document.getElementById('profBgFile').click()">🎨 Загрузить фон</button>
<img id="profBgPreview" style="max-width:100%;max-height:80px;margin:6px 0;display:none">
<button class="bt btgr" onclick="saveProfile()">💾 Сохранить</button>
<button class="bt btg" onclick="closeModal('profModal')">Отмена</button>
</div></div>

<div class="mo" id="addContactModal"><div class="mb">
<h3>Добавить контакт</h3>
<input id="findNick" placeholder="Никнейм">
<button class="bt" onclick="addContact()">Найти</button>
<button class="bt btg" onclick="closeModal('addContactModal')">Отмена</button>
</div></div>

<div class="mo" id="promoModal"><div class="mb">
<h3>Активировать промокод</h3>
<input id="promoInput" placeholder="Введите промокод" style="text-transform:uppercase">
<button class="bt btgr" onclick="activatePromo()">Активировать</button>
<button class="bt btg" onclick="closeModal('promoModal')">Отмена</button>
</div></div>

<div class="mo" id="adminPromoModal"><div class="mb">
<h3>Создать промокод</h3>
<input id="apCode" placeholder="Код (напр. VIP2026)" style="text-transform:uppercase">
<input id="apDesc" placeholder="Описание (для чего)">
<input id="apDays" type="number" value="30" placeholder="Дней VIP">
<input id="apLimit" type="number" value="1" placeholder="Лимит использований">
<button class="bt btgr" onclick="adminCreatePromo()">Создать</button>
<button class="bt btg" onclick="closeModal('adminPromoModal')">Отмена</button>
</div></div>

<div class="ts" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script>
// ============ FIREBASE ============
var firebaseConfig = {
  apiKey: "AIzaSyB6pS8EIEn2MuXI5ALVtzLv47i6_TCIBNc",
  authDomain: "shadow-cdd92.firebaseapp.com",
  projectId: "shadow-cdd92",
  storageBucket: "shadow-cdd92.firebasestorage.app",
  messagingSenderId: "680697444173",
  appId: "1:680697444173:web:a762854719f1a08413e904"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

// ============ STATE ============
var state = {
  user: null,
  profile: { nickname: 'Гость', isPremium: false, avatarUrl: '', bannerUrl: '', bgUrl: '', description: '', banned: false },
  page: 'profile',
  viewUid: null,
  dialogUid: null,
  contacts: [],
  topicId: null,
  isAdmin: false,
  promoPreview: { ava: '', banner: '', bg: '' }
};

// ============ HELPERS ============
function $(id) { return document.getElementById(id); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._tid); t._tid = setTimeout(function() { t.classList.remove('on'); }, 2500); }
function color(name) {
  var c = ['#e91e63','#4caf50','#ff9800','#2196f3','#9c27b0','#00bcd4','#ff5722','#3f51b5'];
  var h = 0; name = name || '?';
  for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return c[Math.abs(h) % c.length];
}
function fmtTime(ts) { if (!ts) return ''; var d = ts.toDate ? ts.toDate() : new Date(ts); return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' ' + fmtTime(ts);
}
function openModal(id) { $(id).classList.add('on'); }
function closeModal(id) { $(id).classList.remove('on'); }

// Сжатие картинки в Base64
function compressImage(file, maxW, maxH, quality, cb) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var w = img.width, h = img.height;
      var ratio = Math.min(maxW / w, maxH / h, 1);
      canvas.width = Math.round(w * ratio);
      canvas.height = Math.round(h * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      var data = canvas.toDataURL('image/jpeg', quality);
      cb(data);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ============ AUTH ============
function onUserClick() { if (!state.user) openModal('authModal'); else nav('profile'); }

function doRegister() {
  var email = $('authEmail').value.trim();
  var pass = $('authPass').value;
  if (!email || !pass || pass.length < 6) { toast('Проверьте email и пароль (6+)'); return; }
  auth.createUserWithEmailAndPassword(email, pass)
    .then(function() { closeModal('authModal'); toast('Регистрация успешна'); })
    .catch(function(e) { toast(e.message); });
}
function doLogin() {
  var email = $('authEmail').value.trim();
  var pass = $('authPass').value;
  if (!email || !pass) { toast('Введите email и пароль'); return; }
  auth.signInWithEmailAndPassword(email, pass)
    .then(function() { closeModal('authModal'); toast('Добро пожаловать'); })
    .catch(function(e) { toast(e.message); });
}
function doLogout() { auth.signOut().then(function() { closeModal('authModal'); toast('Вы вышли'); }); }

auth.onAuthStateChanged(function(user) {
  if (user) {
    state.user = user;
    db.collection('users').doc(user.uid).get().then(function(doc) {
      if (doc.exists) {
        state.profile = Object.assign(state.profile, doc.data());
      } else {
        state.profile = { nickname: user.email.split('@')[0], isPremium: false, avatarUrl: '', bannerUrl: '', bgUrl: '', description: '', banned: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(), lastSeen: firebase.firestore.FieldValue.serverTimestamp() };
        return db.collection('users').doc(user.uid).set(state.profile);
      }
    }).then(function() {
      // Проверяем админа
      return db.collection('admins').doc(user.uid).get();
    }).then(function(adm) {
      state.isAdmin = adm.exists;
      // Обновляем lastSeen
      db.collection('users').doc(user.uid).update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
      loadContacts();
      updateUserUI();
      render();
    }).catch(function(e) { console.error(e); toast('Ошибка: ' + e.message); });
  } else {
    state.user = null;
    state.profile = { nickname: 'Гость', isPremium: false, avatarUrl: '', bannerUrl: '', bgUrl: '', description: '', banned: false };
    state.isAdmin = false;
    state.contacts = [];
    updateUserUI();
    render();
  }
});

function updateUserUI() {
  var ava = $('miniAva'); var name = $('miniName');
  if (state.user) {
    name.textContent = state.profile.nickname || 'Гость';
    if (state.profile.avatarUrl) { ava.style.backgroundImage = 'url(' + state.profile.avatarUrl + ')'; ava.textContent = ''; }
    else { ava.style.backgroundImage = ''; ava.textContent = (state.profile.nickname || '?').substring(0,2).toUpperCase(); }
    ava.style.backgroundColor = color(state.profile.nickname);
    ava.className = 'av' + (state.profile.isPremium ? ' vp' : '');
  } else {
    name.textContent = 'Войти'; ava.style.backgroundImage = ''; ava.textContent = '?'; ava.style.backgroundColor = '#999'; ava.className = 'av';
  }
}

// ============ CONTACTS ============
function loadContacts() {
  if (!state.user) { state.contacts = []; return; }
  try { var raw = localStorage.getItem('contacts_' + state.user.uid); state.contacts = raw ? JSON.parse(raw) : []; } catch(e) { state.contacts = []; }
}
function saveContacts() { if (!state.user) return; try { localStorage.setItem('contacts_' + state.user.uid, JSON.stringify(state.contacts)); } catch(e) {} }
function getContact(uid) { for (var i = 0; i < state.contacts.length; i++) if (state.contacts[i].uid === uid) return state.contacts[i]; return null; }
function addOrUpdateContact(uid, nickname) {
  var c = getContact(uid);
  if (!c) state.contacts.push({ uid: uid, nickname: nickname || '', customName: null });
  else if (nickname) c.nickname = nickname;
  saveContacts();
}

// ============ NAV ============
function nav(page, uid) {
  state.page = page;
  state.viewUid = (page === 'profile') ? (uid || (state.user ? state.user.uid : null)) : null;
  if (page === 'messages' && uid) state.dialogUid = uid;
  render();
}
function goProfile(uid) { if (!state.user) { openModal('authModal'); return; } nav('profile', uid); }
function startChat(uid) { if (!state.user) { openModal('authModal'); return; } addOrUpdateContact(uid, ''); nav('messages', uid); }

// ============ RENDER ============
function render() {
  renderTopNav(); renderSideMenu();
  var app = $('app');
  if (!state.user) { app.innerHTML = '<div class="bk"><div class="bb" style="text-align:center;padding:40px 15px"><p style="margin-bottom:12px">Войдите или зарегистрируйтесь</p><button class="bt" onclick="openModal(\'authModal\')">Войти</button></div></div>'; return; }

  // Проверка бана
  if (state.profile.banned) {
    app.innerHTML = '<div class="bk"><div class="bb" style="text-align:center;padding:40px 15px"><h3 style="color:#d9534f;margin-bottom:10px">🚫 Вы забанены</h3><p>Обратитесь к администрации.</p><button class="bt btg" style="margin-top:12px" onclick="doLogout()">Выйти</button></div></div>';
    return;
  }

  if (state.page === 'profile') renderProfile(app);
  else if (state.page === 'wall') renderWall(app);
  else if (state.page === 'forum') renderForum(app);
  else if (state.page === 'topic') renderTopic(app);
  else if (state.page === 'messages') renderMessages(app);
  else if (state.page === 'admin' && state.isAdmin) renderAdmin(app);
  else if (state.page === 'premium') renderPremium(app);
  else renderProfile(app);
}

function renderTopNav() {
  var pages = [
    {id:'profile',l:'👤 Профиль'},{id:'wall',l:'📝 Стена'},
    {id:'forum',l:'💬 Форум'},{id:'messages',l:'✉️ Сообщения'}
  ];
  if (state.isAdmin) pages.push({id:'admin',l:'⚙️ Админка'});
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    html += '<a href="#" onclick="nav(\'' + pages[i].id + '\');return false" class="' + (state.page === pages[i].id ? 'ac' : '') + '">' + pages[i].l + '</a>';
  }
  $('navTop').innerHTML = html;
}

function renderSideMenu() {
  var pages = [
    {id:'profile',l:'👤 Мой профиль'},{id:'wall',l:'📝 Стена'},
    {id:'forum',l:'💬 Форум'},{id:'messages',l:'✉️ Сообщения'}
  ];
  if (!state.profile.isPremium) pages.push({id:'premium',l:'⭐ Премиум'});
  if (state.isAdmin) pages.push({id:'admin',l:'⚙️ Админ-панель'});
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    html += '<a href="#" onclick="nav(\'' + pages[i].id + '\');return false" class="' + (state.page === pages[i].id ? 'ac' : '') + '">' + pages[i].l + '</a>';
  }
  $('sideMenu').innerHTML = html;
}

// ============ PROFILE ============
function renderProfile(app) {
  var uid = state.viewUid || state.user.uid;
  var isMe = uid === state.user.uid;
  if (isMe) { showProfileCard(app, state.profile, true, uid); return; }
  app.innerHTML = '<div class="bk"><div class="bb">Загрузка...</div></div>';
  db.collection('users').doc(uid).get().then(function(doc) {
    if (!doc.exists) { app.innerHTML = '<div class="bk"><div class="bb">Пользователь не найден</div></div>'; return; }
    showProfileCard(app, doc.data(), false, uid);
  }).catch(function(e) { app.innerHTML = '<div class="bk"><div class="bb">Ошибка: ' + esc(e.message) + '</div></div>'; });
}

function showProfileCard(app, p, isMe, uid) {
  var bannerStyle = p.bannerUrl ? 'background-image:url(' + p.bannerUrl + ');' : '';
  var bannerClass = p.bannerUrl ? '' : ' banner-empty';
  var bannerText = p.bannerUrl ? '' : (p.isPremium ? 'VIP баннер не установлен' : 'Баннер доступен VIP');
  var avaStyle = p.avatarUrl ? 'background-image:url(' + p.avatarUrl + ');background-size:cover;' : 'background-color:' + color(p.nickname) + ';';
  var initial = p.avatarUrl ? '' : (p.nickname || '?').substring(0,2).toUpperCase();
  var pageStyle = p.bgUrl ? 'background-image:url(' + p.bgUrl + ');background-size:cover;background-attachment:fixed;' : '';

  app.innerHTML = '<div class="bk" style="' + pageStyle + '">' +
    '<div class="banner' + bannerClass + '" style="' + bannerStyle + '">' + bannerText + '</div>' +
    '<div class="bb" style="text-align:center;padding:0 12px 20px">' +
      '<div class="prof-ava' + (p.isPremium ? ' vp' : '') + '" style="' + avaStyle + '">' + initial + '</div>' +
      '<h3 style="margin-bottom:6px;font-size:16px">' + esc(p.nickname) +
        (p.isPremium ? ' <span class="bd">VIP</span>' : '') + '</h3>' +
      '<p style="color:#666;margin-bottom:12px;font-size:12px">' + esc(p.description || 'Нет описания') + '</p>' +
      (isMe ? '<button class="bt" onclick="openProfEdit()">✏️ Редактировать</button>'
            : '<button class="bt" onclick="startChat(\'' + uid + '\')">💬 Написать</button>') +
      (isMe && !p.isPremium ? ' <button class="bt" style="background:var(--gold);color:#000" onclick="nav(\'premium\')">⭐ VIP</button>' : '') +
    '</div></div>';
}

function openProfEdit() {
  $('profNick').value = state.profile.nickname || '';
  $('profDesc').value = state.profile.description || '';
  state.promoPreview = { ava: state.profile.avatarUrl || '', banner: state.profile.bannerUrl || '', bg: state.profile.bgUrl || '' };
  $('profAvaPreview').style.display = 'none';
  $('profBannerPreview').style.display = 'none';
  $('profBgPreview').style.display = 'none';
  openModal('profModal');
}

// Обработчики загрузки файлов
document.addEventListener('change', function(e) {
  if (e.target.id === 'profAvaFile' && e.target.files[0]) {
    compressImage(e.target.files[0], 300, 300, 0.8, function(data) {
      state.promoPreview.ava = data;
      var img = $('profAvaPreview'); img.src = data; img.style.display = 'block';
    });
  }
  if (e.target.id === 'profBannerFile' && e.target.files[0]) {
    compressImage(e.target.files[0], 1200, 400, 0.75, function(data) {
      state.promoPreview.banner = data;
      var img = $('profBannerPreview'); img.src = data; img.style.display = 'block';
    });
  }
  if (e.target.id === 'profBgFile' && e.target.files[0]) {
    compressImage(e.target.files[0], 800, 800, 0.7, function(data) {
      state.promoPreview.bg = data;
      var img = $('profBgPreview'); img.src = data; img.style.display = 'block';
    });
  }
});

function saveProfile() {
  if (!state.user) return;
  var newP = {
    nickname: $('profNick').value.trim() || 'Гость',
    description: $('profDesc').value.trim(),
    avatarUrl: state.promoPreview.ava || state.profile.avatarUrl || ''
  };
  // Баннер и фон — только для VIP
  if (state.profile.isPremium) {
    newP.bannerUrl = state.promoPreview.banner || state.profile.bannerUrl || '';
    newP.bgUrl = state.promoPreview.bg || state.profile.bgUrl || '';
  }
  state.profile = Object.assign(state.profile, newP);
  updateUserUI(); closeModal('profModal'); render();
  db.collection('users').doc(state.user.uid).update(newP)
    .then(function() { toast('Профиль сохранён'); })
    .catch(function(e) { toast(e.message); });
}

// ============ PREMIUM / PROMO ============
function renderPremium(app) {
  app.innerHTML = '<div class="bk"><div class="bh">⭐ Премиум</div>' +
    '<div class="bb" style="text-align:center;padding:20px">' +
      (state.profile.isPremium
        ? '<h3 style="color:var(--gold)">✅ У вас активен VIP</h3><p style="margin-top:8px">Доступны: баннер профиля, фон, без задержек на отправку.</p>'
        : '<h3>Получите VIP</h3>' +
          '<p style="margin:10px 0;font-size:12px;color:#666">Ускоренная отправка, баннер, фон профиля, значок VIP.</p>' +
          '<p style="margin:8px 0">Введите промокод:</p>' +
          '<button class="bt" style="background:var(--gold);color:#000" onclick="openModal(\'promoModal\')">🎟 Активировать промокод</button>'
      ) +
    '</div></div>';
}

function activatePromo() {
  var code = $('promoInput').value.trim().toUpperCase();
  if (!code) return;
  db.collection('promocodes').doc(code).get().then(function(doc) {
    if (!doc.exists) { toast('Промокод не найден'); return; }
    var p = doc.data();
    if (p.used >= p.limit) { toast('Промокод исчерпан'); return; }
    // Применяем
    var days = p.days || 30;
    var until = Date.now() + days * 24 * 60 * 60 * 1000;
    db.collection('users').doc(state.user.uid).update({
      isPremium: true,
      premiumUntil: until
    }).then(function() {
      return db.collection('promocodes').doc(code).collection('uses').add({
        uid: state.user.uid,
        nickname: state.profile.nickname,
        usedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(function() {
      return db.collection('promocodes').doc(code).update({ used: (p.used || 0) + 1 });
    }).then(function() {
      state.profile.isPremium = true;
      state.profile.premiumUntil = until;
      updateUserUI();
      closeModal('promoModal');
      $('promoInput').value = '';
      toast('🎉 VIP активирован на ' + days + ' дней');
      render();
    }).catch(function(e) { toast(e.message); });
  }).catch(function(e) { toast(e.message); });
}

// ============ WALL ============
function renderWall(app) {
  app.innerHTML = '<div class="bk"><div class="bh">📝 Стена</div><div class="bb" id="wallList">Загрузка...</div></div>' +
    '<div class="bk"><div class="bh">✍️ Новая запись</div><div class="bb">' +
      '<textarea id="wallText" placeholder="Что нового?"></textarea>' +
      '<div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<button class="bt" onclick="postWall()">Отправить</button>' +
        '<label style="font-size:12px"><input type="checkbox" id="wallAnon" style="width:auto;margin-right:4px">Анонимно</label>' +
      '</div></div></div>';

  db.collection('wall').orderBy('timestamp', 'desc').limit(50)
    .onSnapshot(function(snap) {
      var list = $('wallList'); if (!list) return;
      if (snap.empty) { list.innerHTML = '<div class="em">Пока нет записей</div>'; return; }
      var html = '';
      snap.forEach(function(doc) {
        var m = doc.data();
        var anon = m.anonymous === true;
        var name = anon ? 'Аноним' : (m.authorName || 'Гость');
        var del = (m.authorId === state.user.uid || state.isAdmin) ? '<a onclick="deleteWall(\'' + doc.id + '\')" style="color:#d9534f;margin-left:8px;cursor:pointer;font-size:10px">🗑</a>' : '';
        html += '<div class="ms">' +
          '<div class="mva" style="background-color:' + color(name) + '">' + name.substring(0,2).toUpperCase() + '</div>' +
          '<div class="mbd"><div class="mmt">' +
            (anon ? '<span class="au an">Аноним</span>' : '<span class="au" onclick="goProfile(\'' + m.authorId + '\')">' + esc(name) + '</span>') +
            '<span>' + fmtDate(m.timestamp) + '</span>' + del +
          '</div><div class="tx">' + esc(m.text).replace(/\n/g,'<br>') + '</div></div></div>';
      });
      list.innerHTML = html;
    }, function(err) {
      var list = $('wallList'); if (list) list.innerHTML = '<div class="em">Ошибка: ' + esc(err.message) + '</div>';
    });
}

function postWall() {
  if (!state.user) return;
  var text = $('wallText').value.trim();
  if (!text) { toast('Введите текст'); return; }
  var anon = $('wallAnon').checked;
  $('wallText').value = ''; $('wallAnon').checked = false;
  db.collection('wall').add({
    authorId: state.user.uid, authorName: state.profile.nickname,
    anonymous: anon, text: text,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(function(e) { toast(e.message); });
}

function deleteWall(id) {
  if (!confirm('Удалить запись?')) return;
  db.collection('wall').doc(id).delete().catch(function(e) { toast(e.message); });
}

    '<div class="bk"><div class="bh">➕ Новая тема</div><div class="bb">' +

      '<textarea id="topicText" placeholder="Первое сообщение"></textarea>' +
      '<button class="bt" style="margin-top:6px" onclick="createTopic()">Создать тему</button>' +
    '</div></div>';

  db.collection('forumTopics').orderBy('createdAt', 'desc').limit(50)
    .onSnapshot(function(snap) {
      var list = $('forumList'); if (!list) return;

      snap.forEach(function(doc) {

function createTopic() {
  if (!state.user) return;
  var title = $('topicTitle').value.trim();
  var text = $('topicText').value.trim();
  if (!title || !text) { toast('Заполните оба поля'); return; }
  var ref = db.collection('forumTopics').doc();
  ref.set({ title: title, authorId: state.user.uid, authorName: state.profile.nickname, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
    .then(function() { return ref.collection('posts').add({ authorId: state.user.uid, authorName: state.profile.nickname, text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); })
    .then(function() { $('topicTitle').value = ''; $('topicText').value = ''; toast('Тема создана'); })
    .catch(function(e) { toast(e.message); });
}

function openTopic(id) { state.topicId = id; state.page = 'topic'; render(); }

// ============ MESSAGES ============
function renderMessages(app) {
  app.innerHTML = '<div class="bk"><div class="bh">✉️ Сообщения</div><div class="bb" style="padding:0"><div class="ch"><div class="chl" id="contactList"></div><div class="chm" id="chatArea"></div></div></div></div>';
  renderContactList();
  renderChat();
}

function renderContactList() {
  var list = $('contactList'); if (!list) return;
  var html = '<div style="padding:8px"><button class="bt" onclick="openModal(\'addContactModal\')">➕ Добавить</button></div>';
  for (var i = 0; i < state.contacts.length; i++) {
    var c = state.contacts[i];
    var name = c.customName || c.nickname || '...';
    html += '<div class="ct ' + (state.dialogUid === c.uid ? 'ac' : '') + '" onclick="openDialog(\'' + c.uid + '\')"><span>' + esc(name) + '</span><button class="rn" onclick="event.stopPropagation();renameContact(\'' + c.uid + '\')">✏️</button></div>';
  }
  list.innerHTML = html;
}

function renderChat() {
  var area = $('chatArea'); if (!area) return;
  if (!state.dialogUid) { area.innerHTML = '<div class="em">Выберите контакт</div>'; return; }
  var c = getContact(state.dialogUid);
  var name = c ? (c.customName || c.nickname || '...') : '...';
  area.innerHTML = '<div style="padding:8px;background:#fafbfc;border-bottom:1px solid #eee">💬 ' + esc(name) + '</div><div class="chms" id="chatMsgs"></div><div class="chi"><input id="privInput" placeholder="Сообщение..."><button class="bt" onclick="sendPrivate()">➤</button></div>';

  db.collection('privateMessages')
    .where('participants', 'array-contains', state.user.uid)
    .orderBy('timestamp', 'asc')
    .onSnapshot(function(snap) {
      var cont = $('chatMsgs'); if (!cont) return;
      var html = '';
      snap.forEach(function(d) {
        var m = d.data();
        if ((m.from === state.user.uid && m.to === state.dialogUid) || (m.from === state.dialogUid && m.to === state.user.uid)) {
          var isMe = m.from === state.user.uid;
          html += '<div class="' + (isMe ? 'mn2' : '') + '" style="margin:4px 0"><span class="bl">' + esc(m.text) + '</span><div class="mtm">' + fmtTime(m.timestamp) + '</div></div>';
        }
      });
      cont.innerHTML = html;
      cont.scrollTop = cont.scrollHeight;
    }, function(err) { var cont = $('chatMsgs'); if (cont) cont.innerHTML = '<div class="em">Ошибка: ' + esc(err.message) + '</div>'; });
}

function openDialog(uid) { state.dialogUid = uid; render(); }

function sendPrivate() {
  if (!state.user) return;
  var text = $('privInput').value.trim();
  if (!text || !state.dialogUid) return;
  $('privInput').value = '';
  db.collection('privateMessages').add({
    from: state.user.uid, to: state.dialogUid,
    participants: [state.user.uid, state.dialogUid],
    text: text,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(function(e) { toast(e.message); });
}

function addContact() {
  var nick = $('findNick').value.trim();
  if (!nick) { toast('Введите ник'); return; }
  db.collection('users').where('nickname', '==', nick).limit(1).get()
    .then(function(snap) {
      if (snap.empty) { toast('Не найден'); return; }
      var doc = snap.docs[0];
      addOrUpdateContact(doc.id, doc.data().nickname);
      closeModal('addContactModal'); $('findNick').value = '';
      state.dialogUid = doc.id; nav('messages', doc.id);
    }).catch(function(e) { toast(e.message); });
}

function renameContact(uid) {
  var c = getContact(uid);
  var cur = c ? (c.customName || c.nickname || '') : '';
  var nn = prompt('Переименовать контакт', cur);
  if (nn === null) return;
  if (c) { c.customName = nn.trim() || null; saveContacts(); render(); }
}

function loadAdminStats() {
  var today = new Date(); today.setHours(0,0,0,0);
  Promise.all([
    db.collection('users').get(),
    db.collection('users').where('lastSeen', '>=', today).get()
  ]).then(function(res) {
    var all = res[0].size;
    var todayActive = res[1].size;
    $('admStats').innerHTML =
      '<div class="adm-stat"><b>' + all + '</b><small>Всего</small></div>' +
      '<div class="adm-stat"><b>' + todayActive + '</b><small>За сегодня</small></div>' +
      '<div class="adm-stat"><b id="onlineCount">-</b><small>Онлайн</small></div>';
  });
}

function loadPromos() {
  db.collection('promocodes').orderBy('createdAt', 'desc').limit(50).get().then(function(snap) {
    var list = $('promoList'); if (!list) return;
    if (snap.empty) { list.innerHTML = '<div class="em">Нет промокодов</div>'; return; }
    var html = '';
    snap.forEach(function(doc) {
      var p = doc.data();
      html += '<div class="promo"><b>' + esc(doc.id) + '</b> — ' + esc(p.description || '') + '<small>Использований: ' + (p.used || 0) + '/' + (p.limit || 0) + ' · Дней: ' + (p.days || 30) + ' · <a onclick="showPromoUses(\'' + doc.id + '\')" style="cursor:pointer;color:#4a76a8">кто использовал</a> · <a onclick="delPromo(\'' + doc.id + '\')" style="cursor:pointer;color:#d9534f">удалить</a></small></div>';
    });
    list.innerHTML = html;
  });
}

function showPromoUses(code) {
  db.collection('promocodes').doc(code).collection('uses').orderBy('usedAt', 'desc').get().then(function(snap) {
    var txt = '';
    snap.forEach(function(d) { var u = d.data(); txt += u.nickname + ' (' + u.uid.substring(0,8) + '...) — ' + fmtDate(u.usedAt) + '\n'; });
    alert(txt || 'Никто не использовал');
  });
}

function adminCreatePromo() {
  var code = $('apCode').value.trim().toUpperCase();
  var desc = $('apDesc').value.trim();
  var days = parseInt($('apDays').value) || 30;
  var limit = parseInt($('apLimit').value) || 1;
  if (!code) { toast('Введите код'); return; }
  db.collection('promocodes').doc(code).set({
    description: desc, days: days, limit: limit, used: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    closeModal('adminPromoModal');
    $('apCode').value = ''; $('apDesc').value = '';
    toast('Промокод создан'); loadPromos();
  }).catch(function(e) { toast(e.message); });
}

function delPromo(code) { if (confirm('Удалить промокод?')) db.collection('promocodes').doc(code).delete().then(loadPromos); }

function loadUsers() {
  db.collection('users').orderBy('lastSeen', 'desc').limit(100).get().then(function(snap) {
    var list = $('userList'); if (!list) return;
    var html = '';
    snap.forEach(function(doc) {
      var u = doc.data();
      html += '<div class="ucard">' +
        '<div><b>' + esc(u.nickname) + '</b> ' + (u.isPremium ? '<span class="bd">VIP</span>' : '') + (u.banned ? ' <span class="bdr">BAN</span>' : '') + '<br><small style="color:#999">' + doc.id.substring(0,8) + '... · ' + fmtDate(u.lastSeen) + '</small></div>' +
        '<div class="actions">' +
          '<button class="bt ' + (u.banned ? 'btgr' : 'btr') + '" onclick="toggleBan(\'' + doc.id + '\',' + !u.banned + ')">' + (u.banned ? 'Разбан' : 'Бан') + '</button>' +
          '<button class="bt ' + (u.isPremium ? 'btg' : 'btgr') + '" onclick="toggleVip(\'' + doc.id + '\',' + !u.isPremium + ')">' + (u.isPremium ? '−VIP' : '+VIP') + '</button>' +
        '</div></div>';
    });
    list.innerHTML = html;
  });
}

function toggleBan(uid, val) { db.collection('users').doc(uid).update({ banned: val }).then(loadUsers); }
function toggleVip(uid, val) { db.collection('users').doc(uid).update({ isPremium: val }).then(loadUsers); }

function toggleMaintenance() {
  db.collection('settings').doc('main').get().then(function(doc) {
    var cur = doc.exists ? doc.data().maintenance : false;
    db.collection('settings').doc('main').set({ maintenance: !cur }, { merge: true }).then(function() {
      toast(!cur ? 'Сайт закрыт' : 'Сайт открыт');
      checkMaintenance();
    });
  });
}

function checkMaintenance() {
  db.collection('settings').doc('main').get().then(function(doc) {
    var mt = doc.exists && doc.data().maintenance;
    var btn = $('mtBtn'); if (btn) btn.textContent = mt ? '✅ Открыть сайт' : '🚧 Закрыть сайт';
  });
}

function fullReset() {
  if (!confirm('⚠️ Удалить ВСЕ данные? Это необратимо.')) return;
  if (!confirm('Точно? Все сообщения, форум, профили будут удалены.')) return;
  var collections = ['wall', 'forumTopics', 'privateMessages', 'promocodes'];
  var promises = collections.map(function(c) {
    return db.collection(c).get().then(function(snap) {
      var batch = db.batch();
      snap.forEach(function(d) { batch.delete(d.ref); });
      return batch.commit();
    });
  });
  Promise.all(promises).then(function() { toast('Все данные удалены'); render(); });
}

// ============ INIT ============
render();
</script>
