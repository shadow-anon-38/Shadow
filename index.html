<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Тень</title>
<style>
:root{--blue:#4a76a8;--blue2:#3b5f8a;--bg:#edeef0;--w:#fff;--bd:#d8dbdf;--lk:#2b587a;--gold:#f5a623;--red:#d9534f;--green:#5cb85c;--hh:44px;--tabbar:56px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Tahoma,Verdana,sans-serif;background:var(--bg);color:#2a2a2a;font-size:13px;line-height:1.4;padding-top:var(--hh);min-height:100vh;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px}
.hd{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--blue);z-index:1000;box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;align-items:center;padding:0 8px;gap:6px}
.lg{color:#fff;font-weight:bold;font-size:15px;white-space:nowrap;text-decoration:none}
.nv{display:flex;gap:2px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nv a{color:#dce4f0;text-decoration:none;padding:6px 8px;border-radius:3px;font-size:11px;white-space:nowrap;position:relative}
.nv a.ac{background:rgba(255,255,255,.2);color:#fff;font-weight:bold}
.us{display:flex;align-items:center;gap:5px;color:#fff;font-size:11px;cursor:pointer;padding:3px 5px;border-radius:3px;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:11px;border:2px solid transparent;background-color:#999}
.av.vp{border-color:var(--gold);box-shadow:0 0 5px var(--gold)}
.badge-notif{background:var(--red);color:#fff;font-size:9px;font-weight:bold;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;display:inline-block;margin-left:4px;vertical-align:top}
.nv a .badge-notif{position:absolute;top:-2px;right:-2px;margin:0;font-size:8px;padding:0 4px}
.ly{max-width:960px;margin:0 auto;padding:8px;display:flex;gap:8px;padding-bottom:calc(var(--tabbar) + 20px)}
.sd{width:170px;flex-shrink:0}
.mn{flex:1;min-width:0}
.bk{background:var(--w);border:1px solid var(--bd);border-radius:4px;margin-bottom:8px;overflow:hidden}
.bh{padding:9px 12px;border-bottom:1px solid var(--bd);font-weight:bold;font-size:13px;background:#fafbfc;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bb{padding:10px 12px;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mna a{display:block;padding:11px 12px;color:var(--lk);text-decoration:none;border-bottom:1px solid #f0f1f3;font-size:13px;position:relative}
.mna a.ac{background:#e8edf3;font-weight:bold;color:#333}
.mna a:last-child{border-bottom:none}
.ms{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f2f3f5}
.ms:last-child{border-bottom:none}
.mva{width:40px;height:40px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px;border:2px solid transparent;background-color:#999}
.mva.vp{border-color:var(--gold);box-shadow:0 0 5px var(--gold)}
.mbd{flex:1;min-width:0}
.mmt{font-size:11px;color:#999;margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.au{font-weight:bold;cursor:pointer}
.au.an{color:#888;font-style:italic;cursor:default}
.tx{word-break:break-word;font-size:13px;white-space:pre-wrap}
.tag{color:#4a76a8;cursor:pointer}
.bt{padding:9px 16px;background:var(--blue2);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:bold;font-family:inherit;min-height:40px}
.bt:active{transform:scale(.97)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt2{background:#5b88bd}.btg{background:#999}.btr{background:var(--red)}.btgr{background:var(--green)}.btgold{background:var(--gold);color:#000}
.bt-sm{padding:5px 10px;font-size:11px;min-height:auto}
.bd{background:var(--gold);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.bdr{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.bdlvl{color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:bold}
input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:4px;padding:10px 12px;font-family:inherit;outline:none;background:#fafbfc}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff}
textarea{resize:vertical;min-height:50px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:15px}
.mo.on{display:flex}
.mb{background:#fff;border-radius:8px;padding:20px;width:100%;max-width:360px;max-height:90vh;overflow-y:auto;text-align:center}
.mb h3{margin-bottom:12px;font-size:16px}
.mb input,.mb textarea{margin-bottom:8px;text-align:left}
.mb .bt{width:100%;margin-bottom:6px}
.ts{position:fixed;bottom:calc(var(--tabbar) + 20px);left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.ts.on{opacity:1}
.em{text-align:center;padding:30px 15px;color:#999;font-size:12px}
.ct{padding:11px 10px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:6px}
.ct.ac{background:#e8edf3}
.ct .rn{background:none;border:none;cursor:pointer;color:#999;font-size:14px;padding:4px 8px}
.ct .ct-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .ct-badge{background:var(--red);color:#fff;font-size:9px;font-weight:bold;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.ch{display:flex;height:55vh;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.chl{width:150px;border-right:1px solid #eee;overflow-y:auto;background:#fafbfc;flex-shrink:0}
.chm{flex:1;display:flex;flex-direction:column;min-width:0}
.chms{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.chi{padding:8px;border-top:1px solid #eee;display:flex;gap:6px}
.chi input{flex:1;min-width:0}
.bl{display:inline-block;padding:6px 11px;border-radius:12px;background:#e8edf3;max-width:85%;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;text-align:left}
.mn2{text-align:right}
.mn2 .bl{background:#c9daf8}
.mtm{font-size:9px;color:#999;margin-top:2px}
.msg-row{display:flex;gap:6px;margin:6px 0;align-items:flex-end}
.msg-row.mine{flex-direction:row-reverse}
.msg-row > div:last-child{min-width:0;max-width:85%}

.maintenance-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center;flex-direction:column;gap:20px}
.maintenance-screen .icon{font-size:80px}
.maintenance-screen h2{font-size:24px}
.maintenance-screen p{font-size:14px;opacity:.8;max-width:400px;line-height:1.5}
.maintenance-screen .logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:13px}

.profile-header{position:relative;background-size:cover;background-position:center;background-color:#4a76a8;min-height:150px}
.profile-header.no-banner{background:linear-gradient(135deg,#4a76a8,#5b88bd)}
.banner-hint{position:absolute;top:8px;right:10px;color:#fff;font-size:10px;opacity:.75;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:10px}
.prof-ava{width:90px;height:90px;border-radius:50%;margin:-45px auto 0;background-size:cover;background-position:center;border:4px solid #fff;position:relative;z-index:2;background-color:#999;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:30px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.prof-ava.vp{border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
.prof-info{padding:10px 12px 18px;text-align:center}
.prof-stats{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:12px;color:#666;flex-wrap:wrap}
.prof-stats span b{color:#333;font-size:14px}
.xp-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffcc66);transition:width .3s}
.file-inp{display:none}
.adm-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.adm-stat{flex:1;min-width:100px;padding:10px;background:#fafbfc;border:1px solid var(--bd);border-radius:4px;text-align:center}
.adm-stat b{font-size:20px;display:block;color:var(--blue2)}
.adm-stat small{font-size:10px;color:#666}
.ucard{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.ucard b{font-size:12px}
.ucard .actions{display:flex;gap:4px}
.ucard .actions button{padding:4px 8px;font-size:10px}
.promo{padding:8px 10px;border-bottom:1px solid #eee;font-size:11px}
.promo b{font-size:12px}
.promo small{color:#666;display:block}
.post-actions{display:flex;gap:12px;margin-top:6px;font-size:11px;color:#888;align-items:center;flex-wrap:wrap}
.post-actions a{cursor:pointer;user-select:none;padding:2px 4px}
.post-actions a:hover{color:var(--blue)}
.liked{color:var(--blue) !important;font-weight:bold}
.post-img{max-width:100%;max-height:400px;border-radius:4px;margin-top:6px;cursor:pointer}
.sort-bar{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--bd);background:#fafbfc;font-size:12px;align-items:center;flex-wrap:wrap}
.sort-bar a{padding:6px 12px;border-radius:14px;cursor:pointer;color:#4a76a8;text-decoration:none}
.sort-bar a.ac{background:var(--blue);color:#fff}
.search-bar{padding:8px 12px;border-bottom:1px solid var(--bd);background:#fafbfc}
.search-bar input{font-size:14px;padding:8px 12px}
.sub-btn{background:none;border:1px solid #4a76a8;color:#4a76a8;border-radius:12px;font-size:10px;padding:2px 8px;cursor:pointer;margin-left:6px}
.sub-btn.subd{background:#4a76a8;color:#fff}

.leader{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #eee;cursor:pointer}
.leader:hover{background:#fafbfc}
.leader .pos{font-weight:bold;width:24px;text-align:center;color:#999}
.leader .pos.top1{color:var(--gold);font-size:16px}
.leader .pos.top2{color:#c0c0c0;font-size:15px}
.leader .pos.top3{color:#cd7f32;font-size:15px}
.leader .score{margin-left:auto;font-weight:bold;color:#333}

.lvl-1,.lvl-2,.lvl-3{background:#9e9e9e}
.lvl-4,.lvl-5,.lvl-6{background:#4caf50}
.lvl-7,.lvl-8,.lvl-9{background:#2196f3}
.lvl-10,.lvl-11,.lvl-12{background:#9c27b0}
.lvl-13,.lvl-14,.lvl-15{background:#ff9800}
.lvl-16,.lvl-17,.lvl-18{background:#e91e63}
.lvl-19,.lvl-20{background:#d32f2f}
.lvl-21,.lvl-22,.lvl-23,.lvl-24,.lvl-25{background:#000;box-shadow:0 0 6px var(--gold)}
.lvl-26,.lvl-27,.lvl-28,.lvl-29,.lvl-30{background:linear-gradient(90deg,#ff0000,#ff8800,#ffff00,#00ff00,#00ffff,#0000ff,#8800ff);box-shadow:0 0 8px #fff}

.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--tabbar);background:#fff;border-top:1px solid var(--bd);z-index:900;box-shadow:0 -1px 4px rgba(0,0,0,.08)}
.tabbar-inner{display:flex;height:100%}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#888;font-size:10px;gap:2px;padding:4px;position:relative}
.tabbar a.ac{color:var(--blue);font-weight:bold}
.tabbar a .ic{font-size:20px;line-height:1}
.tabbar a .badge-notif{position:absolute;top:4px;right:calc(50% - 22px);margin:0;font-size:8px;padding:0 4px}

/* Поиск пользователей */
.search-section{padding:8px 12px;background:#f0f6ff;border-bottom:1px solid var(--bd)}
.search-section h4{font-size:11px;color:#666;margin-bottom:6px;font-weight:bold;text-transform:uppercase}
.user-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:4px;cursor:pointer;transition:background .1s}
.user-row:hover{background:rgba(74,118,168,.1)}
.user-row .info{flex:1;min-width:0}
.user-row .info b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .info small{color:#999;font-size:10px}

@media(max-width:800px){
  .sd{display:none}
  .tabbar{display:block}
  .ly{padding:6px;padding-bottom:calc(var(--tabbar) + 12px)}
  .nv{display:none}
  .lg{font-size:14px;flex:1}
  .us span{display:none}
  .us{padding:4px}
  .bb{max-height:none}
  .ch{height:auto;flex-direction:column}
  .chl{width:100%;max-height:150px;border-right:none;border-bottom:1px solid #eee;display:flex;overflow-x:auto}
  .chl .ct{min-width:130px;border-bottom:none;border-right:1px solid #eee}
  .chm{height:60vh}
  .bh{font-size:12px}
  .prof-ava{width:80px;height:80px;margin-top:-40px;font-size:26px}
  .profile-header{min-height:120px}
  .sort-bar a{padding:6px 10px;font-size:11px}
}
@media(max-width:800px) and (orientation:landscape){
  .sd{display:block;width:130px}
  .mna a{padding:8px 10px;font-size:12px}
  .tabbar{display:none}
  .ly{padding-bottom:20px}
  .bb{max-height:55vh}
  .ch{flex-direction:row}
  .chl{width:140px;max-height:none;flex-direction:column;border-right:1px solid #eee;border-bottom:none}
  .chl .ct{min-width:auto;border-right:none;border-bottom:1px solid #eee}
  .chm{height:auto}
}
@media(max-width:400px){
  .lg{font-size:13px}
  .prof-ava{width:70px;height:70px;margin-top:-35px;font-size:22px}
  .profile-header{min-height:100px}
  .sort-bar a{padding:5px 8px;font-size:10px}
}
</style>
</head>
<body>

<div id="maintenanceScreen" class="maintenance-screen" style="display:none;">
  <div class="icon">🚧</div>
  <h2>Сайт временно закрыт</h2>
  <p id="maintenanceText">Технические работы. Заходите позже.</p>
  <button class="logout" onclick="doLogout()">Выйти из аккаунта</button>
</div>

<div class="hd">
<a href="#" class="lg" onclick="nav('profile');return false">📚 Тень</a>
<div class="nv" id="navTop"></div>
<div class="us" id="userMini" onclick="onUserClick()">
<div class="av" id="miniAva">?</div>
<span id="miniName">Войти</span>
</div>
</div>

<div class="ly">
<div class="sd"><div class="bk mna" id="sideMenu"></div></div>
<div class="mn" id="app"></div>
</div>

<div class="tabbar" id="tabbar"><div class="tabbar-inner" id="tabbarInner"></div></div>

<div class="mo" id="authModal"><div class="mb">
<h3>Вход / Регистрация</h3>
<input type="email" id="authEmail" placeholder="Email">
<input type="password" id="authPass" placeholder="Пароль">
<button class="bt" onclick="doRegister()">Зарегистрироваться</button>
<button class="bt bt2" onclick="doLogin()">Войти</button>
<button class="bt btg" onclick="doLogout()">Выйти</button>
<button class="bt btg" onclick="closeModal('authModal')">Закрыть</button>
</div></div>

<div class="mo" id="profModal"><div class="mb">
<h3>Редактировать профиль</h3>
<input id="profNick" placeholder="Никнейм" maxlength="20">
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:4px 0">Описание</label>
<textarea id="profDesc" placeholder="О себе" maxlength="200" style="min-height:60px"></textarea>
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:8px 0 4px">Аватар</label>
<input type="file" id="profAvaFile" accept="image/*" class="file-inp">
<button class="bt bt2" onclick="document.getElementById('profAvaFile').click()">📷 Загрузить аватар</button>
<img id="profAvaPreview" style="max-width:80px;max-height:80px;margin:6px auto;display:none;border-radius:50%">
<button class="bt btg bt-sm" onclick="removeAva()" style="margin-top:4px">🗑 Убрать аватар</button>
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:8px 0 4px">Баннер (VIP)</label>
<input type="file" id="profBannerFile" accept="image/*" class="file-inp">
<button class="bt bt2" onclick="document.getElementById('profBannerFile').click()">🖼 Баннер</button>
<img id="profBannerPreview" style="max-width:100%;max-height:80px;margin:6px 0;display:none">
<button class="bt btg bt-sm" onclick="removeBanner()" style="margin-top:4px">🗑 Убрать баннер</button>
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:8px 0 4px">Фон профиля</label>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
  <label style="font-size:11px"><input type="radio" name="bgType" value="color" onchange="bgTypeChange()"> Цвет</label>
  <label style="font-size:11px"><input type="radio" name="bgType" value="image" onchange="bgTypeChange()"> Картинка</label>
</div>
<input type="color" id="profBgColor" value="#edeef0" style="height:40px">
<input type="file" id="profBgFile" accept="image/*" class="file-inp">
<button class="bt bt2" onclick="document.getElementById('profBgFile').click()" style="margin-top:4px">🎨 Загрузить фон</button>
<img id="profBgPreview" style="max-width:100%;max-height:80px;margin:6px 0;display:none">
<button class="bt btg bt-sm" onclick="removeBg()" style="margin-top:4px">🗑 Убрать фон</button>
<label style="display:block;text-align:left;font-size:11px;color:#666;margin:8px 0 4px">Цвет ника (VIP)</label>
<input type="color" id="profNickColor" value="#2b587a" style="height:40px">
<label style="display:block;text-align:left;font-size:12px;margin:8px 0"><input type="checkbox" id="hideStats" style="width:auto;margin-right:6px">Скрыть лайки и подписки</label>
<label style="display:block;text-align:left;font-size:12px;margin:8px 0"><input type="checkbox" id="hideFromTop" style="width:auto;margin-right:6px">Скрыть меня из топа и поиска</label>
<button class="bt btgr" onclick="saveProfile()" style="margin-top:8px">💾 Сохранить</button>
<button class="bt btg" onclick="closeModal('profModal')">Отмена</button>
</div></div>

<div class="mo" id="addContactModal"><div class="mb">
<h3>Добавить контакт</h3>
<input id="findNick" placeholder="Никнейм">
<button class="bt" onclick="addContact()">Найти</button>
<button class="bt btg" onclick="closeModal('addContactModal')">Отмена</button>
</div></div>

<div class="mo" id="promoModal"><div class="mb">
<h3>Активировать промокод</h3>
<input id="promoInput" placeholder="Введите промокод" style="text-transform:uppercase">
<button class="bt btgr" onclick="activatePromo()">Активировать</button>
<button class="bt btg" onclick="closeModal('promoModal')">Отмена</button>
</div></div>

<div class="mo" id="adminPromoModal"><div class="mb">
<h3>Создать промокод</h3>
<input id="apCode" placeholder="Код" style="text-transform:uppercase">
<input id="apDesc" placeholder="Описание">
<input id="apDays" type="number" value="30" placeholder="Дней VIP">
<input id="apLimit" type="number" value="1" placeholder="Лимит">
<button class="bt btgr" onclick="adminCreatePromo()">Создать</button>
<button class="bt btg" onclick="closeModal('adminPromoModal')">Отмена</button>
</div></div>

<div class="mo" id="adminMaintModal"><div class="mb">
<h3>Закрыть сайт</h3>
<p style="font-size:12px;color:#666;margin-bottom:8px">Текст, который увидят пользователи:</p>
<textarea id="maintText" placeholder="Технические работы. Заходите позже." style="min-height:80px"></textarea>
<button class="bt btr" onclick="confirmMaintenance()">🚧 Закрыть сайт</button>
<button class="bt btg" onclick="closeModal('adminMaintModal')">Отмена</button>
</div></div>

<div class="mo" id="imgModal"><div class="mb" style="max-width:90vw;background:transparent;padding:0">
<img id="imgFull" style="max-width:100%;max-height:85vh;border-radius:6px">
<button class="bt btg" style="margin-top:10px" onclick="closeModal('imgModal')">Закрыть</button>
</div></div>

<div class="ts" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

// ============ HELPERS ============
function $(id) { return document.getElementById(id); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._tid); t._tid = setTimeout(function() { t.classList.remove('on'); }, 2500); }
function color(name) {
  var c = ['#e91e63','#4caf50','#ff9800','#2196f3','#9c27b0','#00bcd4','#ff5722','#3f51b5'];
  var h = 0; name = name || '?';
  for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return c[Math.abs(h) % c.length];
}
function fmtTime(ts) { if (!ts) return ''; var d = ts.toDate ? ts.toDate() : new Date(ts); return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' ' + fmtTime(ts);
}
function openModal(id) { $(id).classList.add('on'); }
function closeModal(id) { $(id).classList.remove('on'); }
function xpForLevel(lvl) { return Math.round(Math.pow(lvl - 1, 2) * 5); }
function calcLevel(xp) {
  xp = xp || 0; var lvl = 1;
  while (xpForLevel(lvl + 1) <= xp) lvl++;
  return lvl;
}
function xpProgress(xp) {
  var lvl = calcLevel(xp);
  var cur = xpForLevel(lvl), next = xpForLevel(lvl + 1);
  var pct = next > cur ? ((xp - cur) / (next - cur) * 100) : 100;
  return { level: lvl, cur: xp - cur, need: next - cur, pct: Math.min(100, pct) };
}
function lvlClass(lvl) {
  if (lvl <= 3) return 'lvl-1';
  if (lvl <= 6) return 'lvl-4';
  if (lvl <= 9) return 'lvl-7';
  if (lvl <= 12) return 'lvl-10';
  if (lvl <= 15) return 'lvl-13';
  if (lvl <= 18) return 'lvl-16';
  if (lvl <= 20) return 'lvl-19';
  if (lvl <= 25) return 'lvl-21';
  return 'lvl-26';
}
function addXP(amount) {
  if (!state.user || !amount) return;
  state.profile.xp = (state.profile.xp || 0) + amount;
  state.profile.level = calcLevel(state.profile.xp);
  db.collection('users').doc(state.user.uid).update({ xp: state.profile.xp, level: state.profile.level }).catch(function(){});
}
function compressImage(file, maxW, maxH, quality, cb) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var w = img.width, h = img.height;
      var ratio = Math.min(maxW / w, maxH / h, 1);
      canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function extractTags(text) {
  if (!text) return [];
  var m = text.match(/#[а-яa-z0-9_]+/gi) || [];
  var uniq = {}, out = [];
  for (var i = 0; i < m.length; i++) {
    var tag = m[i].toLowerCase().replace('#','');
    if (!uniq[tag]) { uniq[tag] = 1; out.push(tag); }
  }
  return out;
}
function renderText(text) {
  var escaped = esc(text);
  return escaped.replace(/#([а-яa-z0-9_]+)/gi, function(m, tag) {
    return '<span class="tag" onclick="searchTag(\'' + tag.toLowerCase() + '\')">#' + tag + '</span>';
  });
}
function checkCooldown() {
  var now = Date.now();
  if (now - lastActionAt < CLOUD_COOLDOWN) {
    toast('⏳ Подождите ' + Math.ceil((CLOUD_COOLDOWN - (now - lastActionAt)) / 1000) + ' сек.');
    return false;
  }
  lastActionAt = now;
  return true;
}
function checkGlobalRate() {
  var ref = db.collection('rateLimits').doc('global');
  var now = Date.now();
  return db.runTransaction(function(tx) {
    return tx.get(ref).then(function(doc) {
      var data = doc.exists ? doc.data() : { events: [] };
      var events = (data.events || []).filter(function(t) { return now - t < 2000; });
      if (events.length >= 3) return { blocked: true, reason: 'Слишком много запросов. Подождите.' };
      events.push(now);
      tx.set(ref, { events: events }, { merge: true });
      return { blocked: false };
    });
  }).catch(function() { return { blocked: false }; });
}

// ============ MAINTENANCE ============
function checkMaintenance() {
  if (settingsUnsub) return;
  settingsUnsub = db.collection('settings').doc('main').onSnapshot(function(doc) {
    var data = doc.exists ? doc.data() : {};
    state.maintenance = !!data.maintenance;
    state.maintenanceText = data.text || 'Технические работы. Заходите позже.';
    applyMaintenance();
  });
}
function applyMaintenance() {
  var screen = $('maintenanceScreen');
  if (!screen) return;
  if (state.maintenance && state.user && !state.isAdmin) {
    $('maintenanceText').textContent = state.maintenanceText;
    screen.style.display = 'flex';
  } else {
    screen.style.display = 'none';
  }
}

// ============ AUTH ============
function onUserClick() { if (!state.user) openModal('authModal'); else nav('profile'); }
function doRegister() {
  var email = $('authEmail').value.trim();
  var pass = $('authPass').value;
  if (!email || !pass || pass.length < 6) { toast('Email и пароль (6+)'); return; }
  auth.createUserWithEmailAndPassword(email, pass)
    .then(function() { closeModal('authModal'); toast('Регистрация успешна'); })
    .catch(function(e) { toast(e.message); });
}
function doLogin() {
  var email = $('authEmail').value.trim();
  var pass = $('authPass').value;
  if (!email || !pass) { toast('Введите email и пароль'); return; }
  auth.signInWithEmailAndPassword(email, pass)
    .then(function() { closeModal('authModal'); toast('Добро пожаловать'); })
    .catch(function(e) { toast(e.message); });
}
function doLogout() { auth.signOut().then(function() { closeModal('authModal'); toast('Вы вышли'); }); }

auth.onAuthStateChanged(function(user) {
  if (user) {
    state.user = user;
    db.collection('users').doc(user.uid).get().then(function(doc) {
      if (doc.exists) {
        state.profile = Object.assign(state.profile, doc.data());
        state.profile.level = calcLevel(state.profile.xp || 0);
      } else {
        state.profile = {
          nickname: user.email.split('@')[0],
          isPremium: false, avatarUrl: '', bannerUrl: '', bgUrl: '', bgColor: '', nickColor: '',
          description: '', banned: false,
          likesReceived: 0, followers: 0, following: 0, hideStats: false, hideFromTop: false,
          xp: 0, level: 1, postsCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        };
        return db.collection('users').doc(user.uid).set(state.profile);
      }
    }).then(function() {
      return db.collection('admins').doc(user.uid).get();
    }).then(function(adm) {
      state.isAdmin = adm.exists;
      db.collection('users').doc(user.uid).update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
      if (profileUnsub) profileUnsub();
      profileUnsub = db.collection('users').doc(user.uid).onSnapshot(function(d) {
        if (!d.exists) return;
        var prevBanned = state.profile.banned;
        var prevPremium = state.profile.isPremium;
        state.profile = Object.assign(state.profile, d.data());
        state.profile.level = calcLevel(state.profile.xp || 0);
        if (prevBanned !== state.profile.banned || prevPremium !== state.profile.isPremium) {
          updateUserUI(); render();
        }
      });
      checkMaintenance();
      loadContacts(); loadUserLikes(); loadUserSubs();
      startUnreadListener();
      updateUserUI(); render();
    }).catch(function(e) { console.error(e); toast('Ошибка: ' + e.message); });
  } else {
    state.user = null;
    state.profile = { nickname: 'Гость', isPremium: false, avatarUrl: '', bannerUrl: '', bgUrl: '', bgColor: '', nickColor: '', description: '', banned: false, likesReceived: 0, followers: 0, following: 0, hideStats: false, hideFromTop: false, xp: 0, level: 1, postsCount: 0 };
    state.isAdmin = false; state.contacts = []; state.userLikes = {}; state.userSubs = {};
    state.unread = {}; state.unreadTotal = 0; state.searchUsers = [];
    if (unreadUnsub) { unreadUnsub(); unreadUnsub = null; }
    if (profileUnsub) { profileUnsub(); profileUnsub = null; }
    updateUserUI(); render();
    applyMaintenance();
  }
});

function updateUserUI() {
  var ava = $('miniAva'); var name = $('miniName');
  if (state.user) {
    name.textContent = state.profile.nickname || 'Гость';
    if (state.profile.avatarUrl) { ava.style.backgroundImage = 'url(' + state.profile.avatarUrl + ')'; ava.textContent = ''; }
    else { ava.style.backgroundImage = ''; ava.textContent = (state.profile.nickname || '?').substring(0,2).toUpperCase(); }
    ava.style.backgroundColor = color(state.profile.nickname);
    ava.className = 'av' + (state.profile.isPremium ? ' vp' : '');
  } else {
    name.textContent = 'Войти'; ava.style.backgroundImage = ''; ava.textContent = '?'; ava.style.backgroundColor = '#999'; ava.className = 'av';
  }
}

// ============ UNREAD ============
function startUnreadListener() {
  if (unreadUnsub) unreadUnsub();
  var lastSeen = {};
  try { lastSeen = JSON.parse(localStorage.getItem('lastRead_' + state.user.uid) || '{}'); } catch(e) { lastSeen = {}; }
  unreadUnsub = db.collection('privateMessages')
    .where('participants', 'array-contains', state.user.uid)
    .orderBy('timestamp', 'desc')
    .limit(100)
    .onSnapshot(function(snap) {
      var unread = {};
      snap.forEach(function(d) {
        var m = d.data();
        if (m.from === state.user.uid) return;
        var lastRead = lastSeen[m.from] || 0;
        var ts = m.timestamp && m.timestamp.toMillis ? m.timestamp.toMillis() : 0;
        if (ts > lastRead) unread[m.from] = (unread[m.from] || 0) + 1;
        // Автодобавление контакта
        if (m.to === state.user.uid && !getContact(m.from)) {
          addOrUpdateContact(m.from, '');
        }
      });
      state.unread = unread;
      var total = 0;
      for (var k in unread) total += unread[k];
      state.unreadTotal = total;
      updateUserUI(); renderTopNav(); renderSideMenu(); renderTabbar();
      if (state.page === 'messages' && !state.dialogUid) renderContactList();
    }, function(err) { console.warn('unread:', err.message); });
}
function markDialogRead(uid) {
  var lastSeen = {};
  try { lastSeen = JSON.parse(localStorage.getItem('lastRead_' + state.user.uid) || '{}'); } catch(e) { lastSeen = {}; }
  lastSeen[uid] = Date.now();
  try { localStorage.setItem('lastRead_' + state.user.uid, JSON.stringify(lastSeen)); } catch(e) {}
  if (state.unread[uid]) {
    delete state.unread[uid];
    state.unreadTotal = 0;
    for (var k in state.unread) state.unreadTotal += state.unread[k];
    updateUserUI(); renderTopNav(); renderSideMenu(); renderTabbar();
  }
}

// ============ LIKES / SUBS ============
function loadUserLikes() {
  if (!state.user) return;
  db.collection('likes').doc(state.user.uid).get().then(function(doc) {
    state.userLikes = doc.exists ? (doc.data().posts || {}) : {};
  }).catch(function(){});
}
function loadUserSubs() {
  if (!state.user) return;
  db.collection('subs').doc(state.user.uid).get().then(function(doc) {
    state.userSubs = doc.exists ? (doc.data().users || {}) : {};
  }).catch(function(){});
}
function toggleLike(postId, collName) {
  if (!state.user) { openModal('authModal'); return; }
  if (!checkCooldown()) return;
  var liked = !!state.userLikes[postId];
  var ref = db.collection(collName).doc(postId);
  ref.get().then(function(doc) {
    if (!doc.exists) return;
    var data = doc.data();
    var count = data.likesCount || 0;
    var authorId = data.authorId;
    var delta = liked ? -1 : 1;
    ref.update({ likesCount: Math.max(0, count + delta) }).then(function() {
      if (liked) delete state.userLikes[postId]; else state.userLikes[postId] = true;
      db.collection('likes').doc(state.user.uid).set({ posts: state.userLikes }, { merge: true });
      if (!liked && authorId && authorId !== state.user.uid) {
        db.runTransaction(function(tx) {
          return tx.get(db.collection('users').doc(authorId)).then(function(u) {
            if (!u.exists) return;
            var d = u.data();
            var xp = (d.xp || 0) + 0.1;
            tx.update(db.collection('users').doc(authorId), { xp: xp, level: calcLevel(xp), likesReceived: (d.likesReceived || 0) + 1 });
          });
        }).catch(function(){});
      }
      render();
    });
  });
}
function toggleSubscribe(targetUid) {
  if (!state.user) { openModal('authModal'); return; }
  if (targetUid === state.user.uid) { toast('Нельзя подписаться на себя'); return; }
  if (!checkCooldown()) return;
  var isSubbed = !!state.userSubs[targetUid];
  var subsRef = db.collection('subs').doc(state.user.uid);
  var targetRef = db.collection('users').doc(targetUid);
  var myRef = db.collection('users').doc(state.user.uid);
  db.runTransaction(function(tx) {
    return tx.get(targetRef).then(function(doc) {
      if (!doc.exists) return;
      var data = doc.data();
      var followers = data.followers || 0;
      tx.update(targetRef, { followers: isSubbed ? Math.max(0, followers - 1) : followers + 1 });
    });
  }).then(function() {
    return db.runTransaction(function(tx) {
      return tx.get(myRef).then(function(doc) {
        var data = doc.exists ? doc.data() : {};
        var following = data.following || 0;
        tx.update(myRef, { following: isSubbed ? Math.max(0, following - 1) : following + 1 });
      });
    });
  }).then(function() {
    if (isSubbed) delete state.userSubs[targetUid]; else state.userSubs[targetUid] = true;
    subsRef.set({ users: state.userSubs }, { merge: true });
    toast(isSubbed ? 'Отписка' : 'Подписка оформлена');
    render();
  }).catch(function(e) { toast(e.message); });
}

// ============ CONTACTS ============
function loadContacts() {
  if (!state.user) { state.contacts = []; return; }
  try { var raw = localStorage.getItem('contacts_' + state.user.uid); state.contacts = raw ? JSON.parse(raw) : []; } catch(e) { state.contacts = []; }
}
function saveContacts() { if (!state.user) return; try { localStorage.setItem('contacts_' + state.user.uid, JSON.stringify(state.contacts)); } catch(e) {} }
function getContact(uid) { for (var i = 0; i < state.contacts.length; i++) if (state.contacts[i].uid === uid) return state.contacts[i]; return null; }
function addOrUpdateContact(uid, nickname) {
  var c = getContact(uid);
  if (!c) state.contacts.push({ uid: uid, nickname: nickname || '', customName: null });
  else if (nickname) c.nickname = nickname;
  saveContacts();
}

// ============ NAV ============
function nav(page, uid) {
  state.page = page;
  state.viewUid = (page === 'profile') ? (uid || (state.user ? state.user.uid : null)) : null;
  if (page === 'messages' && uid) { state.dialogUid = uid; markDialogRead(uid); }
  render();
}
function goProfile(uid) { if (!state.user) { openModal('authModal'); return; } nav('profile', uid); }
function startChat(uid) { if (!state.user) { openModal('authModal'); return; } addOrUpdateContact(uid, ''); nav('messages', uid); }
function searchTag(tag) {
  state.wallSearch = '#' + tag; state.forumSearch = '#' + tag;
  state.page = 'wall'; render();
}

// ============ ПОИСК ПОЛЬЗОВАТЕЛЕЙ ============
function searchUsersByQuery(q, cb) {
  q = (q || '').trim().toLowerCase();
  if (q.length < 2) { cb([]); return; }
  db.collection('users').limit(200).get().then(function(snap) {
    var res = [];
    snap.forEach(function(doc) {
      var u = doc.data();
      var nick = (u.nickname || '').toLowerCase();
      if (nick.indexOf(q) === -1) return;
      // Скрытые от поиска видны только админам
      if (u.hideFromTop && !state.isAdmin) return;
      res.push({ uid: doc.id, nickname: u.nickname, avatarUrl: u.avatarUrl || '', isPremium: !!u.isPremium, level: u.level || 1, description: u.description || '' });
    });
    cb(res.slice(0, 10));
  }).catch(function() { cb([]); });
}

function onSearchInput(value, mode) {
  // mode = 'wall' | 'forum'
  if (mode === 'wall') state.wallSearch = value;
  if (mode === 'forum') state.forumSearch = value;
  if (searchDebounce) clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function() {
    if (value.trim().length >= 2) {
      searchUsersByQuery(value, function(users) {
        state.searchUsers = users;
        if (mode === 'wall') listenWall();
        if (mode === 'forum') listenForum();
      });
    } else {
      state.searchUsers = [];
      if (mode === 'wall') listenWall();
      if (mode === 'forum') listenForum();
    }
  }, 300);
}

function renderUserSearchSection() {
  if (!state.searchUsers.length) return '';
  var html = '<div class="search-section"><h4>👥 Пользователи</h4>';
  for (var i = 0; i < state.searchUsers.length; i++) {
    var u = state.searchUsers[i];
    var avaStyle = u.avatarUrl
      ? 'background-image:url(' + u.avatarUrl + ');background-size:cover;background-position:center;'
      : 'background-color:' + color(u.nickname) + ';';
    var initial = u.avatarUrl ? '' : (u.nickname || '?').substring(0,2).toUpperCase();
    html += '<div class="user-row" onclick="goProfile(\'' + u.uid + '\')">' +
      '<div class="mva' + (u.isPremium ? ' vp' : '') + '" style="width:32px;height:32px;font-size:11px;' + avaStyle + '">' + initial + '</div>' +
      '<div class="info"><b>' + esc(u.nickname) + (u.isPremium ? ' <span class="bd">VIP</span>' : '') + '</b>' +
      '<small>Ур. ' + u.level + (u.description ? ' · ' + esc(u.description.substring(0,40)) : '') + '</small></div>' +
      '<button class="sub-btn ' + (state.userSubs[u.uid] ? 'subd' : '') + '" onclick="event.stopPropagation();toggleSubscribe(\'' + u.uid + '\')">' + (state.userSubs[u.uid] ? '✓' : '➕') + '</button>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

// ============ RENDER ============
function render() {
  renderTopNav(); renderSideMenu(); renderTabbar();
  var app = $('app');
  if (!state.user) {
    app.innerHTML = '<div class="bk"><div class="bb" style="text-align:center;padding:40px 15px"><p style="margin-bottom:12px">Войдите или зарегистрируйтесь</p><button class="bt" onclick="openModal(\'authModal\')">Войти</button></div></div>';
    applyMaintenance();
    return;
  }
  if (state.profile.banned && !state.isAdmin) {
    app.innerHTML = '<div class="bk"><div class="bb" style="text-align:center;padding:40px 15px"><h3 style="color:#d9534f;margin-bottom:10px">🚫 Вы забанены</h3><p>Обратитесь к администрации.</p><button class="bt btg" style="margin-top:12px" onclick="doLogout()">Выйти</button></div></div>';
    return;
  }
  if (state.page === 'profile') renderProfile(app);
  else if (state.page === 'wall') renderWall(app);
  else if (state.page === 'forum') renderForum(app);
  else if (state.page === 'topic') renderTopic(app);
  else if (state.page === 'messages') renderMessages(app);
  else if (state.page === 'rating') renderRating(app);
  else if (state.page === 'admin' && state.isAdmin) renderAdmin(app);
  else if (state.page === 'premium') renderPremium(app);
  else renderProfile(app);
  applyMaintenance();
}

function renderTopNav() {
  var pages = [
    {id:'profile',l:'👤 Профиль'},{id:'wall',l:'📝 Стена'},
    {id:'forum',l:'💬 Форум'},
    {id:'messages',l:'✉️ Сообщения',badge: state.unreadTotal},
    {id:'rating',l:'🏆 Рейтинг'}
  ];
  if (state.isAdmin) pages.push({id:'admin',l:'⚙️ Админка'});
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    var p = pages[i];
    var badge = p.badge ? '<span class="badge-notif">' + (p.badge > 99 ? '99+' : p.badge) + '</span>' : '';
    html += '<a href="#" onclick="nav(\'' + p.id + '\');return false" class="' + (state.page === p.id ? 'ac' : '') + '">' + p.l + badge + '</a>';
  }
  $('navTop').innerHTML = html;
}
function renderSideMenu() {
  var pages = [
    {id:'profile',l:'👤 Мой профиль'},{id:'wall',l:'📝 Стена'},
    {id:'forum',l:'💬 Форум'},
    {id:'messages',l:'✉️ Сообщения',badge: state.unreadTotal},
    {id:'rating',l:'🏆 Рейтинг'}
  ];
  if (!state.profile.isPremium) pages.push({id:'premium',l:'⭐ Премиум'});
  if (state.isAdmin) pages.push({id:'admin',l:'⚙️ Админ-панель'});

// ============ PROFILE ============
function renderProfile(app) {
  var uid = state.viewUid || state.user.uid;
  var isMe = uid === state.user.uid;
  if (isMe) { showProfileCard(app, state.profile, true, uid); return; }
  app.innerHTML = '<div class="bk"><div class="bb">Загрузка...</div></div>';
  db.collection('users').doc(uid).get().then(function(doc) {
    if (!doc.exists) { app.innerHTML = '<div class="bk"><div class="bb">Пользователь не найден</div></div>'; return; }
    showProfileCard(app, doc.data(), false, uid);
  }).catch(function(e) { app.innerHTML = '<div class="bk"><div class="bb">Ошибка: ' + esc(e.message) + '</div></div>'; });
}
function showProfileCard(app, p, isMe, uid) {
  var hasBanner = !!p.bannerUrl;
  var headerStyle = hasBanner ? 'background-image:url(' + p.bannerUrl + ');' : '';
  var headerClass = hasBanner ? 'profile-header' : 'profile-header no-banner';
  var bannerHint = '';
  if (isMe && !hasBanner && p.isPremium) bannerHint = '<span class="banner-hint">Баннер не установлен</span>';
  if (isMe && !p.isPremium) bannerHint = '<span class="banner-hint">VIP → баннер</span>';
  var avaStyle = p.avatarUrl
    ? 'background-image:url(' + p.avatarUrl + ');background-size:cover;background-position:center;'
    : 'background-color:' + color(p.nickname) + ';';
  var initial = p.avatarUrl ? '' : (p.nickname || '?').substring(0,2).toUpperCase();
  var pageBg = '';
  if (p.bgUrl) pageBg = 'background-image:url(' + p.bgUrl + ');background-size:cover;background-position:center;';
  else if (p.bgColor) pageBg = 'background-color:' + p.bgColor + ';';
  var hideStats = !!p.hideStats && !isMe;
  var statsHtml = '';
  if (!hideStats) {
    statsHtml = '<div class="prof-stats">' +
      '<span>❤️ <b>' + (p.likesReceived || 0) + '</b></span>' +
      '<span>👥 <b>' + (p.followers || 0) + '</b></span>' +
      '<span>📤 <b>' + (p.following || 0) + '</b></span>' +
      '<span>📝 <b>' + (p.postsCount || 0) + '</b></span>' +
      '</div>';
  } else {
    statsHtml = '<div class="prof-stats" style="color:#999">Статистика скрыта</div>';
  }
  var xpInfo = xpProgress(p.xp || 0);
  var xpHtml = '<div style="margin:10px 0 0"><div class="xp-bar"><div class="xp-fill" style="width:' + xpInfo.pct + '%"></div></div>' +
    '<div style="font-size:10px;color:#666">Уровень ' + xpInfo.level + ' · ' + xpInfo.cur.toFixed(1) + '/' + xpInfo.need + ' XP</div></div>';
  var nickStyle = p.nickColor ? 'color:' + p.nickColor + ';' : '';
  var lvl = p.level || 1;
  var lvlBadge = '<span class="bdlvl ' + lvlClass(lvl) + '">Ур. ' + lvl + '</span>';
  var subBtn = '';
  if (!isMe) {
    var subbed = !!state.userSubs[uid];
    subBtn = '<button class="bt ' + (subbed ? 'btg' : 'btgr') + '" onclick="toggleSubscribe(\'' + uid + '\')">' + (subbed ? '❌ Отписаться' : '➕ Подписаться') + '</button>';
  }
  app.innerHTML = '<div class="bk" style="' + pageBg + '">' +
    '<div class="' + headerClass + '" style="' + headerStyle + '">' + bannerHint + '</div>' +
    '<div style="position:relative">' +
      '<div class="prof-ava' + (p.isPremium ? ' vp' : '') + '" style="' + avaStyle + '">' + initial + '</div>' +
      '<div class="prof-info">' +
        '<h3 style="margin-bottom:6px;font-size:16px;' + nickStyle + '">' + esc(p.nickname) +
          (p.isPremium ? ' <span class="bd">VIP</span>' : '') + ' ' + lvlBadge + '</h3>' +
        '<p style="color:#666;margin-bottom:12px;font-size:12px">' + esc(p.description || 'Нет описания') + '</p>' +
        (isMe ? '<button class="bt" onclick="openProfEdit()">✏️ Редактировать</button>'
              : '<button class="bt" onclick="startChat(\'' + uid + '\')">💬 Написать</button> ' + subBtn) +
        (isMe && !p.isPremium ? ' <button class="bt btgold" onclick="nav(\'premium\')">⭐ VIP</button>' : '') +
        xpHtml + statsHtml +
      '</div>' +
    '</div></div>';
}
function openProfEdit() {
  $('profNick').value = state.profile.nickname || '';
  $('profDesc').value = state.profile.description || '';
  $('hideStats').checked = !!state.profile.hideStats;
  $('hideFromTop').checked = !!state.profile.hideFromTop;
  $('profBgColor').value = state.profile.bgColor || '#edeef0';

function bgTypeChange() {

}

function removeAva() { state.promoPreview.ava = ''; state.profile.avatarUrl = ''; $('profAvaPreview').style.display = 'none'; toast('Аватар будет убран'); }
function removeBanner() { state.promoPreview.banner = ''; state.profile.bannerUrl = ''; $('profBannerPreview').style.display = 'none'; toast('Баннер будет убран'); }
function removeBg() { state.promoPreview.bg = ''; state.profile.bgUrl = ''; state.profile.bgColor = ''; $('profBgPreview').style.display = 'none'; toast('Фон будет убран'); }
function saveProfile() {
  if (!state.user) return;
  var newP = {
    nickname: $('profNick').value.trim() || 'Гость',
    description: $('profDesc').value.trim(),
    hideStats: $('hideStats').checked,
    hideFromTop: $('hideFromTop').checked
  };
  if (state.promoPreview.ava !== null) newP.avatarUrl = state.promoPreview.ava;
  if (state.profile.isPremium) {
    if (state.promoPreview.banner !== null) newP.bannerUrl = state.promoPreview.banner;
    if (state.promoPreview.bg !== null) {
      if (state.bgType === 'image') { newP.bgUrl = state.promoPreview.bg; newP.bgColor = ''; }
      else { newP.bgColor = $('profBgColor').value; newP.bgUrl = ''; }
    } else if (state.bgType === 'color') {
      newP.bgColor = $('profBgColor').value;
      if (!state.profile.bgUrl) newP.bgUrl = '';
    }
    newP.nickColor = $('profNickColor').value;
  }
  state.profile = Object.assign(state.profile, newP);
  updateUserUI(); closeModal('profModal'); render();
  db.collection('users').doc(state.user.uid).update(newP)
    .then(function() { toast('Профиль сохранён'); })
    .catch(function(e) { toast(e.message); });
}

// ============ PREMIUM ============
function renderPremium(app) {
  app.innerHTML = '<div class="bk"><div class="bh">⭐ Премиум</div>' +
    '<div class="bb" style="text-align:center;padding:20px">' +
      (state.profile.isPremium
        ? '<h3 style="color:var(--gold)">✅ У вас VIP</h3>'
        : '<h3>Получите VIP</h3><p style="margin:8px 0">Введите промокод:</p><button class="bt btgold" onclick="openModal(\'promoModal\')">🎟 Активировать</button>') +
    '</div></div>';
}
function activatePromo() {
  var code = $('promoInput').value.trim().toUpperCase();
  if (!code) return;
  db.collection('promocodes').doc(code).get().then(function(doc) {
    if (!doc.exists) { toast('Не найден'); return; }
    var p = doc.data();
    if (p.used >= p.limit) { toast('Исчерпан'); return; }
    var days = p.days || 30;
    var until = Date.now() + days * 24 * 60 * 60 * 1000;
    db.collection('users').doc(state.user.uid).update({ isPremium: true, premiumUntil: until }).then(function() {
      return db.collection('promocodes').doc(code).collection('uses').add({
        uid: state.user.uid, nickname: state.profile.nickname,
        usedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(function() {
      return db.collection('promocodes').doc(code).update({ used: (p.used || 0) + 1 });
    }).then(function() {
      state.profile.isPremium = true;
      updateUserUI(); closeModal('promoModal'); $('promoInput').value = '';
      toast('🎉 VIP активирован'); render();
    });
  });
}

function setSort(mode) { state.sortMode = mode; render(); }
function listenWall() {
  var ref = db.collection('wall');
  if (state.sortMode === 'top') ref = ref.orderBy('likesCount', 'desc').limit(50);
  else ref = ref.orderBy('timestamp', 'desc').limit(50);
  ref.onSnapshot(function(snap) {
    var list = $('wallList'); if (!list) return;
    var sectionEl = $('wallSearchSection');
    if (sectionEl) sectionEl.innerHTML = renderUserSearchSection();
    var search = (state.wallSearch || '').toLowerCase().trim();
    var html = '', count = 0;
    snap.forEach(function(doc) {
      var m = doc.data();
      if (search) {
        var hay = (m.text || '').toLowerCase();
        var tags = (m.tags || []).join(' ');
        var author = (m.authorName || '').toLowerCase();
        if (hay.indexOf(search.replace('#','')) === -1 && tags.indexOf(search.replace('#','')) === -1 && author.indexOf(search) === -1) return;
      }
      count++;
      html += renderWallPost(doc.id, m);
    });
    list.innerHTML = count ? html : '<div class="em">Ничего не найдено</div>';
  }, function(err) { var list = $('wallList'); if (list) list.innerHTML = '<div class="em">Ошибка: ' + esc(err.message) + '</div>'; });
}
function renderWallPost(id, m) {
  var anon = m.anonymous === true;
  var name = anon ? 'Аноним' : (m.authorName || 'Гость');
  var ava = anon ? '' : (m.authorAvatar || '');
  var vip = anon ? false : !!m.authorPremium;
  var isMine = !anon && m.authorId === state.user.uid;
  var canEdit = isMine || state.isAdmin;
  var liked = !!state.userLikes[id];
  var avaStyle = ava
    ? 'background-image:url(' + ava + ');background-size:cover;background-position:center;'
    : 'background-color:' + color(name) + ';';
  var initial = ava ? '' : name.substring(0,2).toUpperCase();
  var imgHtml = m.imageUrl ? '<img class="post-img" src="' + m.imageUrl + '" onclick="openImg(\'' + m.imageUrl + '\')">' : '';
  // FIX: админ видит настоящий ник анонима
  var authorSpan;
  if (anon) {
    if (state.isAdmin && m.authorName) {
      authorSpan = '<span class="au an">Аноним</span> <span style="color:#c00;font-size:10px" title="Видно только админам">(' + esc(m.authorName) + ')</span>';
    } else {
      authorSpan = '<span class="au an">Аноним</span>';
    }
  } else {
    authorSpan = '<span class="au" onclick="goProfile(\'' + m.authorId + '\')">' + esc(name) + '</span>' +
      (vip ? ' <span class="bd">VIP</span>' : '') + subBtnHtml(m.authorId, name);
  }
  return '<div class="ms">' +
    '<div class="mva' + (vip ? ' vp' : '') + '" style="' + avaStyle + '">' + initial + '</div>' +
    '<div class="mbd"><div class="mmt">' + authorSpan +
      '<span>' + fmtDate(m.timestamp) + '</span>' +
    '</div><div class="tx">' + renderText(m.text).replace(/\n/g,'<br>') + '</div>' + imgHtml +
    '<div class="post-actions">' +
      '<a class="' + (liked ? 'liked' : '') + '" onclick="toggleLike(\'' + id + '\',\'wall\')">' + (liked ? '❤️' : '🤍') + ' ' + (m.likesCount || 0) + '</a>' +
      (canEdit ? '<a onclick="editWall(\'' + id + '\')">✏️ Изменить</a>' : '') +
      (canEdit ? '<a onclick="deleteWall(\'' + id + '\')" style="color:#d9534f">🗑 Удалить</a>' : '') +
    '</div></div></div>';
}
function openImg(url) { $('imgFull').src = url; openModal('imgModal'); }
function postWall() {
  if (!state.user) return;
  var text = $('wallText').value.trim();
  var img = window._wallImgTmp ? window._wallImgTmp() : '';
  if (!text && !img) { toast('Введите текст или фото'); return; }
  if (!checkCooldown()) return;
  checkGlobalRate().then(function(r) {
    if (r.blocked) { toast('⚠️ ' + r.reason); return; }
    var anon = $('wallAnon').checked;
    db.collection('wall').add({
      authorId: state.user.uid, authorName: state.profile.nickname,
      authorAvatar: state.profile.avatarUrl || '', authorPremium: !!state.profile.isPremium,
      anonymous: anon, text: text, imageUrl: img || '',
      tags: extractTags(text), likesCount: 0,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      $('wallText').value = ''; $('wallAnon').checked = false;
      if (window._clearWallImg) window._clearWallImg();
      addXP(0.5);
      db.collection('users').doc(state.user.uid).update({ postsCount: (state.profile.postsCount || 0) + 1 }).catch(function(){});
      state.profile.postsCount = (state.profile.postsCount || 0) + 1;
      toast('+0.5 XP · Опубликовано');
    }).catch(function(e) { toast(e.message); });
  });
}
function editWall(id) {
  var newText = prompt('Редактировать текст:');
  if (newText === null) return;
  if (!checkCooldown()) return;
  db.collection('wall').doc(id).update({ text: newText, tags: extractTags(newText) })
    .then(function() { toast('Изменено'); }).catch(function(e) { toast(e.message); });
}
function deleteWall(id) {
  if (!confirm('Удалить запись?')) return;
  if (!checkCooldown()) return;
  db.collection('wall').doc(id).delete().catch(function(e) { toast(e.message); });
}

  ref.onSnapshot(function(snap) {
    var list = $('forumList'); if (!list) return;

    if (sectionEl) sectionEl.innerHTML = renderUserSearchSection();

    snap.forEach(function(doc) {

function createTopic() {
  if (!state.user) return;
  var title = $('topicTitle').value.trim();
  var text = $('topicText').value.trim();
  if (!title || !text) { toast('Заполните оба поля'); return; }
  if (!checkCooldown()) return;
  checkGlobalRate().then(function(r) {
    if (r.blocked) { toast('⚠️ ' + r.reason); return; }
    var ref = db.collection('forumTopics').doc();
    ref.set({
      title: title, authorId: state.user.uid, authorName: state.profile.nickname,
      authorAvatar: state.profile.avatarUrl || '', authorPremium: !!state.profile.isPremium,
      likesCount: 0, tags: extractTags(text + ' ' + title),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      return ref.collection('posts').add({
        authorId: state.user.uid, authorName: state.profile.nickname,
        authorAvatar: state.profile.avatarUrl || '', authorPremium: !!state.profile.isPremium,
        text: text, likesCount: 0, tags: extractTags(text),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(function() {
      $('topicTitle').value = ''; $('topicText').value = '';
      addXP(1);
      db.collection('users').doc(state.user.uid).update({ postsCount: (state.profile.postsCount || 0) + 1 }).catch(function(){});
      state.profile.postsCount = (state.profile.postsCount || 0) + 1;
      toast('+1 XP · Тема создана');
    }).catch(function(e) { toast(e.message); });
  });
}
function openTopic(id) { state.topicId = id; state.page = 'topic'; render(); }
function renderTopic(app) {
  app.innerHTML = '<div class="bk"><div class="bb">Загрузка...</div></div>';
  var topicId = state.topicId;
  db.collection('forumTopics').doc(topicId).get().then(function(doc) {
    if (!doc.exists) { nav('forum'); return; }
    var t = doc.data();
    var liked = !!state.userLikes[topicId];
    var isMine = t.authorId === state.user.uid;
    var canEdit = isMine || state.isAdmin;
    app.innerHTML = '<div class="bk">' +
      '<div class="bh">📌 ' + esc(t.title) + ' <button class="bt bt2 bt-sm" style="margin-left:auto" onclick="nav(\'forum\')">← Назад</button></div>' +
      '<div class="bb" style="border-bottom:1px solid #f2f3f5">' +
        '<div style="font-size:11px;color:#999;margin-bottom:6px">Автор: <span class="au" onclick="goProfile(\'' + t.authorId + '\')">' + esc(t.authorName) + '</span>' + subBtnHtml(t.authorId, t.authorName) + ' · ' + fmtDate(t.createdAt) + '</div>' +
        '<div class="tx">' + renderText(t.text) + '</div>' +
        '<div class="post-actions">' +
          '<a class="' + (liked ? 'liked' : '') + '" onclick="toggleLike(\'' + topicId + '\',\'forumTopics\')">' + (liked ? '❤️' : '🤍') + ' ' + (t.likesCount || 0) + '</a>' +
          (canEdit ? '<a onclick="editTopic(\'' + topicId + '\')">✏️ Изменить</a>' : '') +
          (canEdit ? '<a onclick="deleteTopic(\'' + topicId + '\')" style="color:#d9534f">🗑 Удалить</a>' : '') +
        '</div>' +
      '</div>' +
      '<div class="bb" id="topicPosts">Загрузка...</div></div>' +
      '<div class="bk"><div class="bh">Ответить</div><div class="bb">' +
        '<textarea id="replyText" placeholder="Ваше сообщение"></textarea>' +
        '<button class="bt" style="margin-top:6px" onclick="replyTopic(\'' + topicId + '\')">Отправить</button>' +
      '</div></div>';
    db.collection('forumTopics').doc(topicId).collection('posts').orderBy('timestamp', 'asc')
      .onSnapshot(function(snap) {
        var list = $('topicPosts'); if (!list) return;
        var html = '';
        snap.forEach(function(d) {
          var p = d.data();
          var pid = d.id;
          var ava = p.authorAvatar || '';
          var vip = !!p.authorPremium;
          var avaStyle = ava
            ? 'background-image:url(' + ava + ');background-size:cover;background-position:center;'
            : 'background-color:' + color(p.authorName) + ';';
          var initial = ava ? '' : p.authorName.substring(0,2).toUpperCase();
          var postLiked = !!state.userLikes[pid];
          var pMine = p.authorId === state.user.uid;
          var pEdit = pMine || state.isAdmin;
          html += '<div class="ms">' +
            '<div class="mva' + (vip ? ' vp' : '') + '" style="' + avaStyle + '">' + initial + '</div>' +
            '<div class="mbd"><div class="mmt"><span class="au" onclick="goProfile(\'' + p.authorId + '\')">' + esc(p.authorName) + '</span>' + (vip ? ' <span class="bd">VIP</span>' : '') + subBtnHtml(p.authorId, p.authorName) + '<span>' + fmtDate(p.timestamp) + '</span></div>' +
            '<div class="tx">' + renderText(p.text) + '</div>' +
            '<div class="post-actions">' +
              '<a class="' + (postLiked ? 'liked' : '') + '" onclick="togglePostLike(\'' + topicId + '\',\'' + pid + '\')">' + (postLiked ? '❤️' : '🤍') + ' ' + (p.likesCount || 0) + '</a>' +
              (pEdit ? '<a onclick="editForumPost(\'' + topicId + '\',\'' + pid + '\')">✏️</a>' : '') +
              (pEdit ? '<a onclick="deleteForumPost(\'' + topicId + '\',\'' + pid + '\')" style="color:#d9534f">🗑</a>' : '') +
            '</div></div></div>';
        });
        list.innerHTML = html || '<div class="em">Нет сообщений</div>';
      });
  });
}
function editTopic(id) {
  var nt = prompt('Новое название:');
  if (nt === null) return;
  if (!checkCooldown()) return;
  db.collection('forumTopics').doc(id).update({ title: nt, tags: extractTags(nt) }).then(function() { toast('Изменено'); });
}
function deleteTopic(id) {
  if (!confirm('Удалить всю тему?')) return;
  if (!checkCooldown()) return;
  db.collection('forumTopics').doc(id).delete().then(function() { nav('forum'); });
}
function editForumPost(topicId, postId) {
  var nt = prompt('Редактировать:');
  if (nt === null) return;
  if (!checkCooldown()) return;
  db.collection('forumTopics').doc(topicId).collection('posts').doc(postId).update({ text: nt, tags: extractTags(nt) }).then(function() { toast('Изменено'); });
}
function deleteForumPost(topicId, postId) {
  if (!confirm('Удалить сообщение?')) return;
  if (!checkCooldown()) return;
  db.collection('forumTopics').doc(topicId).collection('posts').doc(postId).delete();
}
function togglePostLike(topicId, postId) {
  if (!state.user) { openModal('authModal'); return; }
  if (!checkCooldown()) return;
  var key = topicId + '_' + postId;
  var liked = !!state.userLikes[key];
  var ref = db.collection('forumTopics').doc(topicId).collection('posts').doc(postId);
  ref.get().then(function(doc) {
    if (!doc.exists) return;
    var data = doc.data();
    var c = data.likesCount || 0;
    ref.update({ likesCount: Math.max(0, c + (liked ? -1 : 1)) }).then(function() {
      if (liked) delete state.userLikes[key]; else state.userLikes[key] = true;
      db.collection('likes').doc(state.user.uid).set({ posts: state.userLikes }, { merge: true });
      if (!liked && data.authorId && data.authorId !== state.user.uid) {
        db.runTransaction(function(tx) {
          return tx.get(db.collection('users').doc(data.authorId)).then(function(u) {
            if (!u.exists) return;
            var d = u.data();
            var xp = (d.xp || 0) + 0.1;
            tx.update(db.collection('users').doc(data.authorId), { xp: xp, level: calcLevel(xp), likesReceived: (d.likesReceived || 0) + 1 });
          });
        }).catch(function(){});
      }
      render();
    });
  });
}
function replyTopic(id) {
  if (!state.user) return;
  var text = $('replyText').value.trim();
  if (!text) { toast('Введите текст'); return; }
  if (!checkCooldown()) return;
  checkGlobalRate().then(function(r) {
    if (r.blocked) { toast('⚠️ ' + r.reason); return; }
    $('replyText').value = '';
    db.collection('forumTopics').doc(id).collection('posts').add({
      authorId: state.user.uid, authorName: state.profile.nickname,
      authorAvatar: state.profile.avatarUrl || '', authorPremium: !!state.profile.isPremium,
      text: text, likesCount: 0, tags: extractTags(text),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      addXP(0.5);
      db.collection('users').doc(state.user.uid).update({ postsCount: (state.profile.postsCount || 0) + 1 }).catch(function(){});
      state.profile.postsCount = (state.profile.postsCount || 0) + 1;
      toast('+0.5 XP');
    }).catch(function(e) { toast(e.message); });
  });
}

// ============ MESSAGES ============
function renderMessages(app) {
  app.innerHTML = '<div class="bk"><div class="bh">✉️ Сообщения</div><div class="bb" style="padding:0"><div class="ch"><div class="chl" id="contactList"></div><div class="chm" id="chatArea"></div></div></div></div>';
  renderContactList();
  renderChat();
}
function renderContactList() {
  var list = $('contactList'); if (!list) return;
  var html = '<div style="padding:8px"><button class="bt" onclick="openModal(\'addContactModal\')">➕</button></div>';
  var sorted = state.contacts.slice().sort(function(a, b) {
    var ua = state.unread[a.uid] || 0;
    var ub = state.unread[b.uid] || 0;
    if (ua !== ub) return ub - ua;
    return (a.customName || a.nickname || '').localeCompare(b.customName || b.nickname || '');
  });
  for (var i = 0; i < sorted.length; i++) {
    var c = sorted[i];
    var name = c.customName || c.nickname || '...';
    var unread = state.unread[c.uid] || 0;
    var badge = unread ? '<span class="ct-badge">' + (unread > 99 ? '99+' : unread) + '</span>' : '';
    html += '<div class="ct ' + (state.dialogUid === c.uid ? 'ac' : '') + '" onclick="openDialog(\'' + c.uid + '\')">' +
      '<span class="ct-name">' + esc(name) + '</span>' + badge +
      '<button class="rn" onclick="event.stopPropagation();renameContact(\'' + c.uid + '\')">✏️</button></div>';
  }
  list.innerHTML = html;
}
function renderChat() {
  var area = $('chatArea'); if (!area) return;
  if (!state.dialogUid) { area.innerHTML = '<div class="em">Выберите контакт</div>'; return; }
  var c = getContact(state.dialogUid);
  var name = c ? (c.customName || c.nickname || '...') : '...';
  area.innerHTML = '<div style="padding:8px;background:#fafbfc;border-bottom:1px solid #eee">💬 ' + esc(name) + '</div><div class="chms" id="chatMsgs"></div><div class="chi"><input id="privInput" placeholder="Сообщение..."><button class="bt" onclick="sendPrivate()">➤</button></div>';
  var avatarCache = {};
  Promise.all([
    db.collection('users').doc(state.user.uid).get(),
    db.collection('users').doc(state.dialogUid).get()
  ]).then(function(res) {
    var me = res[0].exists ? res[0].data() : {};
    var other = res[1].exists ? res[1].data() : {};
    avatarCache[state.user.uid] = { url: me.avatarUrl || '', name: me.nickname || 'Я', premium: !!me.isPremium };
    avatarCache[state.dialogUid] = { url: other.avatarUrl || '', name: other.nickname || name, premium: !!other.isPremium };
    db.collection('privateMessages')
      .where('participants', 'array-contains', state.user.uid)
      .orderBy('timestamp', 'asc')
      .onSnapshot(function(snap) {
        var cont = $('chatMsgs'); if (!cont) return;
        var html = '';
        snap.forEach(function(d) {
          var m = d.data();
          if ((m.from === state.user.uid && m.to === state.dialogUid) || (m.from === state.dialogUid && m.to === state.user.uid)) {
            var isMe = m.from === state.user.uid;
            var info = avatarCache[m.from] || { url: '', name: '?', premium: false };
            var avaStyle = info.url
              ? 'background-image:url(' + info.url + ');background-size:cover;background-position:center;'
              : 'background-color:' + color(info.name) + ';';
            var initial = info.url ? '' : info.name.substring(0,2).toUpperCase();
            html += '<div class="msg-row' + (isMe ? ' mine' : '') + '">' +
              '<div class="mva' + (info.premium ? ' vp' : '') + '" style="width:28px;height:28px;font-size:10px;' + avaStyle + '">' + initial + '</div>' +
              '<div style="' + (isMe ? 'text-align:right;' : '') + '">' +
                '<span class="bl">' + esc(m.text) + '</span>' +
                '<div class="mtm">' + fmtTime(m.timestamp) + '</div>' +
              '</div></div>';
          }
        });
        cont.innerHTML = html;
        cont.scrollTop = cont.scrollHeight;
      }, function(err) { var cont = $('chatMsgs'); if (cont) cont.innerHTML = '<div class="em">Ошибка: ' + esc(err.message) + '</div>'; });
  });
}
function openDialog(uid) { state.dialogUid = uid; markDialogRead(uid); render(); }
function sendPrivate() {
  if (!state.user) return;
  var text = $('privInput').value.trim();
  if (!text || !state.dialogUid) return;
  if (!checkCooldown()) return;
  $('privInput').value = '';
  db.collection('privateMessages').add({
    from: state.user.uid, to: state.dialogUid,
    participants: [state.user.uid, state.dialogUid],
    text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() { addXP(0.1); }).catch(function(e) { toast(e.message); });
}
function addContact() {
  var nick = $('findNick').value.trim();
  if (!nick) { toast('Введите ник'); return; }
  db.collection('users').where('nickname', '==', nick).limit(1).get()
    .then(function(snap) {
      if (snap.empty) { toast('Не найден'); return; }
      var doc = snap.docs[0];
      addOrUpdateContact(doc.id, doc.data().nickname);
      closeModal('addContactModal'); $('findNick').value = '';
      state.dialogUid = doc.id; nav('messages', doc.id);
    });
}
function renameContact(uid) {
  var c = getContact(uid);
  var cur = c ? (c.customName || c.nickname || '') : '';
  var nn = prompt('Переименовать', cur);
  if (nn === null) return;
  if (c) { c.customName = nn.trim() || null; saveContacts(); render(); }
}

// ============ RATING ============
function renderRating(app) {
  var tabs = [
    {id:'level', l:'⭐ Уровень'},
    {id:'likes', l:'❤️ Лайки'},
    {id:'followers', l:'👥 Подписки'},
    {id:'posts', l:'📝 Сообщения'}
  ];
  var sortField = { level: 'level', likes: 'likesReceived', followers: 'followers', posts: 'postsCount' }[state.leaderTab] || 'level';
  app.innerHTML = '<div class="bk"><div class="bh">🏆 Таблица лидеров</div>' +
    '<div class="sort-bar">' +
      tabs.map(function(t) {
        return '<a class="' + (state.leaderTab === t.id ? 'ac' : '') + '" onclick="setLeaderTab(\'' + t.id + '\')">' + t.l + '</a>';
      }).join('') +
    '</div>' +
    '<div class="bb" id="leaderList">Загрузка...</div></div>';
  db.collection('users').orderBy(sortField, 'desc').limit(50).get()
    .then(function(snap) {
      var list = $('leaderList');
      var html = '', pos = 1;
      snap.forEach(function(doc) {
        var u = doc.data();
        // Скрытые из топа не показываются (кроме админа)
        if (u.hideFromTop && !state.isAdmin) return;
        var ava = u.avatarUrl || '';
        var avaStyle = ava
          ? 'background-image:url(' + ava + ');background-size:cover;background-position:center;'
          : 'background-color:' + color(u.nickname) + ';';
        var initial = ava ? '' : (u.nickname||'?').substring(0,2).toUpperCase();
        var score = u[sortField] || 0;
        var posCls = pos === 1 ? 'top1' : pos === 2 ? 'top2' : pos === 3 ? 'top3' : '';
        var lvl = u.level || 1;
        html += '<div class="leader" onclick="goProfile(\'' + doc.id + '\')">' +
          '<span class="pos ' + posCls + '">' + pos + '</span>' +
          '<div class="mva' + (u.isPremium ? ' vp' : '') + '" style="width:32px;height:32px;font-size:11px;' + avaStyle + '">' + initial + '</div>' +
          '<div><b>' + esc(u.nickname) + '</b> <span class="bdlvl ' + lvlClass(lvl) + '">Ур. ' + lvl + '</span>' +
          (u.hideFromTop ? ' <span style="color:#999;font-size:10px" title="Скрыт из топа">👁‍🗨</span>' : '') + '</div>' +
          '<span class="score">' + (typeof score === 'number' ? score.toFixed(score % 1 ? 1 : 0) : score) + '</span>' +
        '</div>';
        pos++;
      });
      list.innerHTML = html || '<div class="em">Нет данных</div>';
    }).catch(function(e) {
      var list = $('leaderList');
      if (list) list.innerHTML = '<div class="em">Ошибка: ' + esc(e.message) + '</div>';
    });
}
function setLeaderTab(t) { state.leaderTab = t; render(); }

// ============ ADMIN ============
function renderAdmin(app) {
  if (!state.isAdmin) { app.innerHTML = '<div class="bk"><div class="bb">Доступ запрещён</div></div>'; return; }
  app.innerHTML = '<div class="bk"><div class="bh">⚙️ Админ-панель</div><div class="bb">' +
    '<div class="adm-stats" id="admStats">Загрузка...</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' +
      '<button class="bt btgr" onclick="openModal(\'adminPromoModal\')">🎟 Промокод</button>' +
      '<button class="bt btr" onclick="openMaintDialog()" id="mtBtn">🚧 Закрыть сайт</button>' +
      '<button class="bt btr" onclick="fullReset()">💥 Сброс</button>' +
    '</div>' +
    '<h4 style="margin:10px 0 6px">🎟 Промокоды</h4><div id="promoList">Загрузка...</div>' +
    '<h4 style="margin:14px 0 6px">👥 Пользователи</h4><div id="userList">Загрузка...</div>' +
    '</div></div>';
  loadAdminStats(); loadPromos(); loadUsers(); refreshMtBtn();
}
function loadAdminStats() {
  var today = new Date(); today.setHours(0,0,0,0);
  Promise.all([db.collection('users').get(), db.collection('users').where('lastSeen', '>=', today).get()])
    .then(function(res) {
      $('admStats').innerHTML =
        '<div class="adm-stat"><b>' + res[0].size + '</b><small>Всего</small></div>' +
        '<div class="adm-stat"><b>' + res[1].size + '</b><small>За сегодня</small></div>';
    });
}
function loadPromos() {
  db.collection('promocodes').orderBy('createdAt', 'desc').limit(50).get().then(function(snap) {
    var list = $('promoList'); if (!list) return;
    if (snap.empty) { list.innerHTML = '<div class="em">Нет промокодов</div>'; return; }
    var html = '';
    snap.forEach(function(doc) {
      var p = doc.data();
      html += '<div class="promo"><b>' + esc(doc.id) + '</b> — ' + esc(p.description || '') + '<small>Исп: ' + (p.used || 0) + '/' + (p.limit || 0) + ' · <a onclick="showPromoUses(\'' + doc.id + '\')" style="cursor:pointer;color:#4a76a8">кто</a> · <a onclick="delPromo(\'' + doc.id + '\')" style="cursor:pointer;color:#d9534f">удалить</a></small></div>';
    });
    list.innerHTML = html;
  });
}
function showPromoUses(code) {
  db.collection('promocodes').doc(code).collection('uses').orderBy('usedAt', 'desc').get().then(function(snap) {
    var txt = '';
    snap.forEach(function(d) { var u = d.data(); txt += u.nickname + ' — ' + fmtDate(u.usedAt) + '\n'; });
    alert(txt || 'Никто');
  });
}
function adminCreatePromo() {
  var code = $('apCode').value.trim().toUpperCase();
  var desc = $('apDesc').value.trim();
  var days = parseInt($('apDays').value) || 30;
  var limit = parseInt($('apLimit').value) || 1;
  if (!code) { toast('Введите код'); return; }
  db.collection('promocodes').doc(code).set({
    description: desc, days: days, limit: limit, used: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    closeModal('adminPromoModal'); $('apCode').value = ''; $('apDesc').value = '';
    toast('Создан'); loadPromos();
  });
}
function delPromo(code) { if (confirm('Удалить?')) db.collection('promocodes').doc(code).delete().then(loadPromos); }
function loadUsers() {
  db.collection('users').orderBy('lastSeen', 'desc').limit(100).get().then(function(snap) {
    var list = $('userList'); if (!list) return;
    var html = '';
    snap.forEach(function(doc) {
      var u = doc.data();
      html += '<div class="ucard">' +
        '<div><b>' + esc(u.nickname) + '</b> ' + (u.isPremium ? '<span class="bd">VIP</span>' : '') + (u.banned ? ' <span class="bdr">BAN</span>' : '') + (u.hideFromTop ? ' <span style="color:#999;font-size:10px">👁‍🗨</span>' : '') + '<br><small style="color:#999">Ур. ' + (u.level||1) + ' · ' + fmtDate(u.lastSeen) + '</small></div>' +
        '<div class="actions">' +
          '<button class="bt ' + (u.banned ? 'btgr' : 'btr') + ' bt-sm" onclick="toggleBan(\'' + doc.id + '\',' + !u.banned + ')">' + (u.banned ? 'Разбан' : 'Бан') + '</button>' +
          '<button class="bt ' + (u.isPremium ? 'btg' : 'btgr') + ' bt-sm" onclick="toggleVip(\'' + doc.id + '\',' + !u.isPremium + ')">' + (u.isPremium ? '−VIP' : '+VIP') + '</button>' +
        '</div></div>';
    });
    list.innerHTML = html;
  });
}
function toggleBan(uid, val) { db.collection('users').doc(uid).update({ banned: val }).then(function() { toast(val ? 'Забанен' : 'Разбанен'); loadUsers(); }); }
function toggleVip(uid, val) { db.collection('users').doc(uid).update({ isPremium: val }).then(function() { toast(val ? 'VIP выдан' : 'VIP снят'); loadUsers(); }); }
function openMaintDialog() {
  db.collection('settings').doc('main').get().then(function(doc) {
    var data = doc.exists ? doc.data() : {};
    if (data.maintenance) {
      db.collection('settings').doc('main').set({ maintenance: false }, { merge: true }).then(function() {
        toast('Сайт открыт'); refreshMtBtn();
      });
    } else {
      $('maintText').value = data.text || 'Технические работы. Заходите позже.';
      openModal('adminMaintModal');
    }
  });
}
function confirmMaintenance() {
  var text = $('maintText').value.trim() || 'Технические работы. Заходите позже.';
  db.collection('settings').doc('main').set({ maintenance: true, text: text }, { merge: true }).then(function() {
    closeModal('adminMaintModal');
    toast('Сайт закрыт');
    refreshMtBtn();
  });
}
function refreshMtBtn() {
  db.collection('settings').doc('main').get().then(function(doc) {
    var mt = doc.exists && doc.data().maintenance;
    var btn = $('mtBtn'); if (btn) btn.textContent = mt ? '✅ Открыть сайт' : '🚧 Закрыть сайт';
  });
}
function fullReset() {
  if (!confirm('⚠️ Удалить ВСЕ данные?')) return;
  if (!confirm('Точно?')) return;
  var collections = ['wall', 'forumTopics', 'privateMessages', 'promocodes'];
  var promises = collections.map(function(c) {
    return db.collection(c).get().then(function(snap) {
      var batch = db.batch();
      snap.forEach(function(d) { batch.delete(d.ref); });
      return batch.commit();
    });
  });
  Promise.all(promises).then(function() { toast('Все удалено'); render(); });
}

// ============ INIT ============
render();
</script>
